name: Apply four Arabic descriptions once
on:
  push:
    paths:
      - '.github/workflows/apply-four-notes-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch note fields only
        shell: python
        run: |
          import json, re
          from pathlib import Path

          specs = {
            "com.dmg.carsalessimulator": "- عملات غير محدودة.\n- رفع المستوى بسرعة.\n- إزالة الإعلانات.",
            "co.noory.books": "- قصص عربية متنوعة.\n- فتح الميزات المدفوعة؛ اضغط على شراء ثم إلغاء.",
            "com.netflix.NGP.BloonsTDSix": "- عدم الموت.\n- أموال غير محدودة.\n- أموال القرد غير محدودة.\n- مستهلكات غير محدودة.\n- فتح جميع الأبراج.\n- فتح جميع الأبطال.",
          }
          kiddo_note = "- ألعاب تعليمية لمرحلة ما قبل المدرسة ورياض الأطفال.\n- فتح جميع الميزات."

          def apps_from(data):
              if isinstance(data, dict): return data.get("apps", [])
              if isinstance(data, list): return data
              return []

          def string_end(s, q):
              i, esc = q + 1, False
              while i < len(s):
                  c = s[i]
                  if esc: esc = False
                  elif c == '\\': esc = True
                  elif c == '"': return i + 1
                  i += 1
              raise RuntimeError("unterminated string")

          def patch_by_name(text, name, note):
              pat = re.compile(r'"name"\s*:\s*' + re.escape(json.dumps(name, ensure_ascii=False)))
              m = pat.search(text)
              if not m: return text, False
              nxt = re.search(r'"name"\s*:', text[m.end():])
              stop = m.end() + nxt.start() if nxt else len(text)
              seg = text[m.end():stop]
              nm = re.search(r'"note"\s*:\s*', seg)
              if not nm: raise RuntimeError(f"note missing for {name}")
              q = m.end() + nm.end()
              while q < len(text) and text[q].isspace(): q += 1
              if q >= len(text) or text[q] != '"': raise RuntimeError(f"note not string for {name}")
              e = string_end(text, q)
              return text[:q] + json.dumps(note, ensure_ascii=False) + text[e:], True

          paths = [Path("jom.json"), *sorted(Path("chunks").glob("apps-*.json"))]
          counts = {k: 0 for k in specs}
          counts["kiddo"] = 0
          changed = []

          for path in paths:
              raw = path.read_text(encoding="utf-8")
              data = json.loads(raw)
              matches = []
              for app in apps_from(data):
                  if not isinstance(app, dict): continue
                  name = str(app.get("name", ""))
                  bundle = str(app.get("bundleId", app.get("bundleID", "")))
                  if bundle in specs:
                      matches.append((name, specs[bundle], bundle))
                  elif "kiddoverse" in name.casefold() or "kiddo verse preschool games" in name.casefold():
                      matches.append((name, kiddo_note, "kiddo"))
              text = raw
              for name, note, key in matches:
                  text2, ok = patch_by_name(text, name, note)
                  if ok:
                      text = text2
                      counts[key] += 1
                      print(f"PATCH {path}: {key} -> {name!r}")
              if text != raw:
                  json.loads(text)
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print("COUNTS", counts)
          print("CHANGED", changed)

          data = json.loads(Path("jom.json").read_text(encoding="utf-8"))
          arr = apps_from(data)[-50:]
          blanks = [str(a.get("name", "")) for a in arr if isinstance(a, dict) and not str(a.get("note", "")).strip()]
          print("LAST50_BLANK_COUNT", len(blanks))
          print("LAST50_BLANK_NAMES", json.dumps(blanks, ensure_ascii=False))
      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-four-notes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update four Arabic app descriptions"
          git push
