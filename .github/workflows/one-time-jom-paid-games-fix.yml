name: One-time jom paid games fix

on:
  push:
    paths:
      - '.github/workflows/one-time-jom-paid-games-fix.yml'

permissions:
  contents: write

jobs:
  fix-jom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update 24 paid games
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('jom.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          targets = {
              'Secret Of Mana',
              'Mist Offline Zombie Survival',
              'Clay Jam Classic',
              'Evocreo 2 Monster Trainer Rpg',
              'DRAGON QUEST 3',
              'FGB Operators',
              'Peace Death',
              'Peace Death 2',
              'Forgotten Memories',
              'Motorsport Manager Mobile 4',
              'Horizon Chase 2',
              'Locks Quest',
              'Unruly Heroes',
              'El Hijo',
              'Goat Simulator Waste Of Space',
              'Goat Simulator Payday',
              'Goat Simulator Goatz',
              'Hardboiled',
              'Hot Lap League',
              'Little Inferno Hd',
              'Little Builders For Kids',
              'Little Fox Animal Doctor',
              'Little Fox Nursery Rhymes',
              'Little Police',
          }

          found = set()
          for app in data.get('apps', []):
              name = app.get('name')
              if name in targets:
                  app['note'] = 'لعبة مدفوعة في المتجر الرسمي.'
                  if name == 'DRAGON QUEST 3':
                      app['category'] = 'ألعاب'
                  found.add(name)

          missing = sorted(targets - found)
          if missing or len(found) != 24:
              raise SystemExit(f'Expected exactly 24 games; found {len(found)}. Missing: {missing}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Updated exactly 24 games.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jom.json
          git diff --cached --quiet && exit 0
          git commit -m "Unify paid game descriptions and fix DRAGON QUEST 3 category"
          git push
