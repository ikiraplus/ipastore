name: Temporary Audit Empty Notes
on:
  push:
    paths:
      - '.github/workflows/temp-audit-notes.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit last 70
        run: |
          python - <<'PY'
          import json
          data=json.load(open('jom.json',encoding='utf-8'))
          apps=data.get('apps',[])
          last=apps[-70:]
          empty=[a.get('name','') for a in last if not str(a.get('note') or '').strip()]
          print('TOTAL_APPS',len(apps))
          print('EMPTY_LAST70',len(empty))
          for i,name in enumerate(empty,1):
              print(f'{i}. {name}')
          PY
