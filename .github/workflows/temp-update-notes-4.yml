name: Temporary Update JOM Notes 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-update-notes-4.yml'

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply note updates
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          doc = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = doc.get('apps', [])
          if not isinstance(apps, list):
              raise RuntimeError('jom.json apps array not found')

          updates = [
              {
                  'name': 'Jackal Squad Classic Shooting',
                  'bundleId': 'com.rocket.jackal.squad',
                  'note': 'مميزات اللعبة:\n- تفعيل حساب VIP.\n- إزالة الإعلانات.\n- فتح جميع الشخصيات والإطارات.\n- نقود وعملات معدنية غير محدودة.\n- مفاتيح ذهبية وفضية غير محدودة.\n- تيتانيوم ومخطوطات غير محدودة.\n- فتح جميع العناصر.\n- وقود غير محدود.'
              },
              {
                  'name': 'Stones and Bones',
                  'bundleId': 'com.stones.bones',
                  'note': 'مميزات اللعبة:\n- إزالة الإعلانات وفتح المكافآت المجانية.\n- جواهر غير محدودة.\n- موارد غير محدودة.\n- وضع عدم الموت.\n- مضاعفة الضرر.'
              },
              {
                  'prefix': 'Tile Home',
                  'bundleId': 'com.tile.travel.triple.match',
                  'note': 'مميزات اللعبة:\n- عملات غير محدودة.\n- مساعدات غير محدودة.\n- نجوم غير محدودة.\n- بدون إعلانات.'
              },
              {
                  'name': 'Skyward Feel Spike',
                  'bundleId': 'com.skyward.feelspike',
                  'note': 'مميزات اللعبة:\n- أحجار كريمة غير محدودة.\n- عملات غير محدودة.\n- نقاط خبرة (XP) غير محدودة.\n- أرواح غير محدودة.'
              },
              {
                  'name': 'Game Maps IRl',
                  'bundleId': 'com.retryapps.game.maps.irl',
                  'note': 'تم فتح جميع المميزات المدفوعة.'
              },
              {
                  'name': 'Colony Flow',
                  'bundleId': 'com.abi.colony.flow',
                  'note': 'مميزات اللعبة:\n- تعطيل الإعلانات تلقائياً.\n- تجميد العملات لمنع استهلاكها.\n- تجميد الأرواح للحفاظ عليها.\n- تجميد المعززات لمنع استهلاكها.'
              },
              {
                  'prefix': 'Auto-Battle Got Me Killed',
                  'bundleId': 'com.kgameboys.abgmk',
                  'note': 'مميزات اللعبة:\n- مضاعفة الضرر.\n- مضاعفة الدفاع.\n- مضاعفة الذهب.\n- سرعة لعب مضاعفة مع التشغيل التلقائي.\n- بدون إعلانات.'
              },
              {
                  'prefix': 'Merge Camp',
                  'note': 'مميزات اللعبة:\n- عملات غير محدودة وتزداد بدلاً من أن تنقص.\n- جواهر غير محدودة وتزداد بدلاً من أن تنقص.\n- طاقة غير محدودة وتزداد بدلاً من أن تنقص.'
              },
              {
                  'name': 'Bunny Farm Zombie Defense',
                  'bundleId': 'com.ngu.games.zombiebunnyfarm',
                  'note': 'مميزات اللعبة:\n- وضع عدم الموت.\n- ضربة واحدة قاتلة.\n- ذخيرة زراعية غير محدودة.\n- بدون فترة انتظار للمهارات.\n- تجاوز حماية التطبيق.\n- عملات غير محدودة.'
              },
          ]

          changed = 0
          skipped = []
          for row in updates:
              bundle = row.get('bundleId')
              name = row.get('name')
              prefix = row.get('prefix')
              matches = []
              if bundle:
                  matches = [a for a in apps if str(a.get('bundleId') or '') == bundle]
              if not matches and name:
                  matches = [a for a in apps if str(a.get('name') or '') == name]
              if not matches and prefix:
                  matches = [a for a in apps if str(a.get('name') or '').startswith(prefix)]

              if len(matches) != 1:
                  label = name or prefix or bundle
                  print(f'Skipped {label}: found {len(matches)} match(es)')
                  skipped.append(label)
                  continue

              matches[0]['note'] = row['note']
              changed += 1
              print('Updated note:', matches[0].get('name'))

          if changed == 0:
              raise RuntimeError('No JOM entries were updated')

          jom_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out = root / 'chunks'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          chunk_size = 100
          chunk_rows = []
          for index, start in enumerate(range(0, len(apps), chunk_size), 1):
              part = apps[start:start + chunk_size]
              filename = f'apps-{index:03d}.json'
              (out / filename).write_text(json.dumps({'apps': part}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              chunk_rows.append({'file': filename, 'start': start, 'count': len(part)})
          manifest = {
              'version': 1,
              'source': 'jom.json',
              'sourceHash': hashlib.sha256(jom_path.read_bytes()).hexdigest()[:20],
              'chunkSize': chunk_size,
              'total': len(apps),
              'chunks': chunk_rows,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          pathlib.Path('.github/workflows/temp-update-notes-4.yml').unlink(missing_ok=True)
          print(f'Applied {changed} note update(s); skipped {len(skipped)}.')

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks .github/workflows/temp-update-notes-4.yml
          git commit -m 'Admin: Update JOM descriptions batch 4 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
