name: Install storage live progress

on:
  push:
    paths:
      - .github/workflows/_install-storage-progress.yml
      - scripts/install_storage_progress.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch storage workflow
        run: python3 scripts/install_storage_progress.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CALLBACK_PROGRESS_URL' .github/workflows/ikiraplus-storage.yml
          grep -q 'uploads.github.com' .github/workflows/ikiraplus-storage.yml
          grep -q 'report_progress("download"' .github/workflows/ikiraplus-storage.yml
          grep -q 'stage": "upload"' .github/workflows/ikiraplus-storage.yml

      - name: Commit patch and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_install-storage-progress.yml scripts/install_storage_progress.py
          git add .github/workflows/ikiraplus-storage.yml
          git commit -m "Add live GitHub transfer progress [skip ci]"
          git push origin HEAD:main
