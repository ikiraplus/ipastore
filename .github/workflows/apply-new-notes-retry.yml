name: Retry latest Arabic descriptions

on:
  push:
    paths:
      - '.github/workflows/apply-new-notes-retry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch descriptions without reformatting JSON
        shell: python
        run: |
          import json, re
          from pathlib import Path

          specs = [
            ("Idle Ninja Online", lambda n,b: "idle ninja online" in n.casefold(), "- مضاعف لعدد الضربات.\n- تعطيل مهارات الأعداء.\n- مضاعف لسرعة الحركة.\n- لا يوجد وقت انتظار للمهارات.\n- استخدام المهارات دون استهلاك المانا.", True),
            ("Moonvale", lambda n,b: "moonvale" in n.casefold(), "- جميع المشتريات مفعلة.\n- الخرائط والمنازل والأثاث والملابس مفتوحة بالكامل منذ البداية.", True),
            ("Formula Ride", lambda n,b: "formula ride" in n.casefold(), "- تعديل النقود لكسب العملات بحرية.\n- تعديل التوكنات لكسب التوكنات بحرية.\n- فتح جميع الحلبات والوصول إلى كل المسارات فوراً.\n- بدون إعلانات.", True),
            ("Little Kitty Big City", lambda n,b: "little kitty" in n.casefold(), "- فتح اللعبة كاملة.\n- الوصول إلى جميع المحتويات دون الحاجة إلى مشتريات داخل التطبيق.", True),
            ("9 Kings", lambda n,b: ("9 kings" in n.casefold() or "9kings" in n.casefold() or n == "Kings 9"), "- فتح اللعبة كاملة.\n- الوصول إلى جميع الملوك والمهام ونمط اللعب الجماعي والمحتوى المميز.", True),
            ("Captain Tsubasa My Golden XI", lambda n,b: ("mygoldenxi" in n.casefold() or "my golden xi" in n.casefold() or b == "com.alpsestudio.pjct"), "- فوز دائم في كل مباراة.", True),
            ("Motor World Car Factory", lambda n,b: ("motor world" in n.casefold() or b == "com.mobage.ww.a1171.motorworldcarfactoryios"), "- نقود غير محدودة.\n- أنفق جزءاً من النقود لتفعيلها.\n- أعلى مستوى.", True),
            ("Bloom Breakfast Merge Town", lambda n,b: ("bloom & breakfast" in n.casefold() or "bloom breakfast" in n.casefold() or b == "com.fortisgames.mergefarmadventure"), "- تجميد الطاقة الذهبية.", True),
            ("Cookie Jam", lambda n,b: ("cookie" in n.casefold() and "jam" in n.casefold()), "- عدد غير نهائي من الحركات.\n- عدد غير نهائي من الأرواح.\n- عدد غير نهائي من المعززات.", False),
            ("Cashier 3D", lambda n,b: ("cashier 3d" in n.casefold() or b == "com.nanotribe.games.cashier3d"), "- مصحح الأخطاء.", True),
            ("Hungry Shark World", lambda n,b: ("hungry shark world" in n.casefold() or b == "com.ubisoft.hungrysharkworld"), "- عملات غير محدودة.\n- جواهر غير محدودة.\n- لآلئ غير محدودة.\n- تعزيزات غير محدودة.\n- تم فتح تذكرة الموسم.", True),
            ("Dummynation", lambda n,b: ("dummynation" in n.casefold() or b == "ahf.dummynation"), "- بريميوم وبدون إعلانات.\n- نقاط بحث غير نهائية.\n- سيولة غير نهائية (الذهب).", True),
          ]

          def apps_from(data):
            if isinstance(data, dict): return data.get("apps", [])
            if isinstance(data, list): return data
            return []

          def string_end(s, q):
            i, esc = q + 1, False
            while i < len(s):
              c = s[i]
              if esc: esc = False
              elif c == '\\': esc = True
              elif c == '"': return i + 1
              i += 1
            raise RuntimeError("unterminated string")

          def patch_by_name(text, name, note):
            pat = re.compile(r'"name"\s*:\s*' + re.escape(json.dumps(name, ensure_ascii=False)))
            m = pat.search(text)
            if not m: return text, False
            nxt = re.search(r'"name"\s*:', text[m.end():])
            stop = m.end() + nxt.start() if nxt else len(text)
            seg = text[m.end():stop]
            nm = re.search(r'"note"\s*:\s*', seg)
            if not nm: raise RuntimeError(f"note field missing for {name}")
            q = m.end() + nm.end()
            while q < len(text) and text[q].isspace(): q += 1
            if q >= len(text) or text[q] != '"': raise RuntimeError(f"note not string for {name}")
            e = string_end(text, q)
            return text[:q] + json.dumps(note, ensure_ascii=False) + text[e:], True

          paths = [Path("jom.json"), *sorted(Path("chunks").glob("apps-*.json"))]
          counts = {k: 0 for k,_,_,_ in specs}
          changed = []

          for path in paths:
            raw = path.read_text(encoding="utf-8")
            data = json.loads(raw)
            matched = {k: [] for k,_,_,_ in specs}
            for app in apps_from(data):
              if not isinstance(app, dict): continue
              n = str(app.get("name", ""))
              b = str(app.get("bundleId", app.get("bundleID", "")))
              for k, pred, note, req in specs:
                if n and pred(n,b) and n not in matched[k]: matched[k].append(n)
            text = raw
            for k, pred, note, req in specs:
              for n in matched[k]:
                text2, ok = patch_by_name(text, n, note)
                if ok:
                  text = text2
                  counts[k] += 1
                  print(f"PATCH {path}: {k} -> {n!r}")
            if text != raw:
              json.loads(text)
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          print("COUNTS")
          for k,v in counts.items(): print(f"{k}: {v}")
          print("CHANGED", changed)
          missing = [k for k,_,_,req in specs if req and counts[k] == 0]
          if missing: raise SystemExit("Missing required targets: " + ", ".join(missing))

      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/apply-new-notes-once.yml
          rm -f .github/workflows/apply-new-notes-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish latest Arabic app descriptions"
          git push
