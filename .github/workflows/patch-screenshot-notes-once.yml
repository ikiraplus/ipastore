name: Patch screenshot descriptions once

on:
  push:
    paths:
      - '.github/workflows/patch-screenshot-notes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update descriptions
        shell: python
        run: |
          import json
          from pathlib import Path

          targets = {
              "com.Agonalea.Punko.io": "مميزات اللعبة:\n- وضع عدم الموت.\n- ضربة قاضية.\n- طاقة بطاقات غير محدودة.\n- نشر فوري للبطاقات.\n- متجر مجاني.",
              "com.klab.heroaca.united.survival": "مميزات اللعبة:\n- إعادة تعيين المهارات دون حدود.\n- قدرات خاصة غير محدودة.",
              "com.asobimo.seisainometria": "مميزات اللعبة:\n- مضاعفة الضرر.\n- مضاعفة الدفاع.\n- نقاط مهارة غير محدودة.\n- استخدام المهارات دون استنزاف.",
              "com.medu.smith.legend.coop.idle.td.ios": "مميزات اللعبة:\n- مضاعفة الضرر.",
              "com.klab.bleach": "مميزات اللعبة:\n- بدون وقت انتظار لاستخدام المهارات.\n- بدون وقت انتظار لاستخدام المهارات المميزة.\n- قتل بضربة واحدة.\n- إزالة تأثير السم.\n\nملاحظة:\n- تعمل المميزات في طور اللعب الفردي فقط.",
              "com.pixelpie.games.bubblemasters": "مميزات اللعبة:\n- صحة غير محدودة.\n- فقاعات غير محدودة.\n- معززات غير محدودة.\n- وقت غير محدود.\n- تسريع شحن القدرات.",
              "com.mobirix.mbbi": "مميزات اللعبة:\n- مضاعفة الضرر.\n- وضع عدم الموت.\n- بدون وقت انتظار للمهارات.\n- فوز فوري.\n- مضاعفة سرعة اللعبة.",
              "studio.gameberry.idlehunter": "مميزات اللعبة:\n- مضاعفة الضرر.\n- مضاعفة الدفاع.\n- نقاط سحرية غير محدودة.\n- تجميد العملات.\n- عملات غير محدودة.",
              "com.gtarcade.ioe.global": "مميزات اللعبة:\n- مضاعفة الضرر.\n- مضاعفة الدفاع.\n\nملاحظة:\n- بعد تعديل القيمة، أعد تشغيل اللعبة."
          }

          name_targets = {
              "Space Quest Alien Invasion": "مميزات اللعبة:\n- مكافآت الإعلانات مجانية.\n- تعديل نقاط الصحة.\n- تعديل نقاط الهجوم.",
              "Space Quest: Alien Invasion": "مميزات اللعبة:\n- مكافآت الإعلانات مجانية.\n- تعديل نقاط الصحة.\n- تعديل نقاط الهجوم.",
          }

          expected_names = {
              "Punko: Tower Defense TD",
              "MHA: UNITED SURVIVAL",
              "Space Quest Alien Invasion",
              "METRIA the Starlight",
              "Smith Legend Idle Rpg",
              "Bleach: Brave Souls Anime Game",
              "Bubble Busters Pvp",
              "Blade Idle",
              "Hunter Raid: Idle RPG Games",
              "Infinity Kingdom",
          }

          changed_names = set()
          changed_files = []

          def patch_file(path: Path):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"SKIP {path}: {e}")
                  return

              apps = data.get("apps", []) if isinstance(data, dict) else data if isinstance(data, list) else []
              dirty = False
              for app in apps:
                  if not isinstance(app, dict):
                      continue
                  bundle = app.get("bundleId", "")
                  name = app.get("name", "")
                  new_note = targets.get(bundle) or name_targets.get(name)
                  if new_note is not None and app.get("note") != new_note:
                      app["note"] = new_note
                      dirty = True
                      changed_names.add(name)
                      print(f"UPDATED {path}: {name}")
              if dirty:
                  path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
                  changed_files.append(str(path))

          root = Path("jom.json")
          if root.exists():
              patch_file(root)
          for p in sorted(Path("chunks").glob("apps-*.json")):
              patch_file(p)

          print("Changed files:", changed_files)
          print("Changed apps:", sorted(changed_names))

          missing = expected_names - changed_names
          # Some repo titles differ slightly; verify by bundle/name presence after patch rather than fail the job.
          if missing:
              print("Names not changed in this run (may already match or have a title variant):", sorted(missing))

      - name: Commit changes and remove one-time workflow
        run: |
          rm -f .github/workflows/patch-screenshot-notes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update app descriptions from screenshots"
          git push
