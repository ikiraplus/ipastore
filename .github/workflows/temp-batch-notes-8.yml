name: Temporary Update JOM Notes 8
on:
  push:
    paths:
      - '.github/workflows/temp-batch-notes-8.yml'
permissions:
  contents: write
jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply note updates
        shell: python
        run: |
          import hashlib, json, pathlib, re, shutil
          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          doc = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = doc.get('apps', [])

          def norm(s):
              return re.sub(r'[^a-z0-9]+', '', str(s or '').lower())

          updates = {
              'rapstaridleclicker': 'مميزات اللعبة:\n- عملات غير محدودة للإنفاق بحرية على الترقيات والتقدم.',
              'mergefashionromancestory': 'مميزات اللعبة:\n- جواهر وعملات وطاقة غير محدودة.',
              'dragracingstreetcargame': 'مميزات اللعبة:\n- ناقل حركة تلقائي محسن لتسارع أسرع.\n\nملاحظة:\n- اضبط ناقل الحركة على الوضع شبه التلقائي/التتابعي، واضغط دواسة الوقود بالكامل عند الإشارة الخضراء دون استخدام زر تبديل السرعة.',
              'hamstersquadidlerpg': 'مميزات اللعبة:\n- ماسات وأموال وقوة غير محدودة.\n- سرعة قصوى لتسريع اللعب والتقدم.',
              'onceworld': 'مميزات اللعبة:\n- مضاعفة الضرر.\n- وضع عدم الموت.',
              'tornadoalleyrampage': 'مميزات اللعبة:\n- فتح جميع عمليات الشراء داخل التطبيق.',
              'fortressfrontlinescardtd': 'مميزات اللعبة:\n- وضع عدم الموت.\n- ضربة قاضية.\n\nملاحظة:\n- قد يؤدي استخدام التعديلات في اللعب عبر الإنترنت إلى الحظر؛ استخدمها على مسؤوليتك.',
              'geardefenders': 'مميزات اللعبة:\n- جواهر وعملات وطاقة وتذاكر إعلانات وعملات معركة غير محدودة.\n- سحب غير محدود.\n- نقاط صحة أساسية.\n- سرعة الترس ونشر أسرع للأسلحة.\n- أسلحة غير محدودة وفوز سهل.\n- هجوم مرتبط.',
              'screwjam': 'مميزات اللعبة:\n- قائمة تصحيح Debug Menu.\n\nملاحظة:\n- لتفعيلها انتقل إلى الإعدادات وفعّل زر «اتصل بنا»، ولإغلاقها أعد تشغيل اللعبة.'
          }

          changed = 0
          for key, note in updates.items():
              matches = [a for a in apps if norm(a.get('name')) == key]
              if len(matches) == 1:
                  matches[0]['note'] = note
                  changed += 1
                  print('Updated note:', matches[0].get('name'))
              else:
                  print('Skipped', key, 'matches=', len(matches), [a.get('name') for a in matches])

          jewels = [a for a in apps if 'jewel' in norm(a.get('name'))]
          print('JEWEL_CANDIDATES', json.dumps([{k:a.get(k) for k in ('name','bundleId','version','addedAt','note')} for a in jewels], ensure_ascii=False))

          if changed == 0:
              raise RuntimeError('No entries updated')

          jom_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          out = root / 'chunks'
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          rows = []
          for index, start in enumerate(range(0, len(apps), 100), 1):
              part = apps[start:start+100]
              fn = f'apps-{index:03d}.json'
              (out/fn).write_text(json.dumps({'apps': part}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              rows.append({'file': fn, 'start': start, 'count': len(part)})
          manifest = {'version':1,'source':'jom.json','sourceHash':hashlib.sha256(jom_path.read_bytes()).hexdigest()[:20],'chunkSize':100,'total':len(apps),'chunks':rows}
          (out/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          pathlib.Path('.github/workflows/temp-batch-notes-8.yml').unlink(missing_ok=True)
          print('Applied', changed, 'updates')
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks .github/workflows/temp-batch-notes-8.yml
          git commit -m 'Admin: Update JOM descriptions batch 8 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
