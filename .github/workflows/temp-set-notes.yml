name: Temporary Set JOM Notes

on:
  push:
    branches: [main]
    paths:
      - 'admin-note-commands/*.json'

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply note updates
        shell: python
        run: |
          import glob
          import hashlib
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          doc = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = doc.get('apps', [])
          if not isinstance(apps, list):
              raise RuntimeError('jom.json apps array not found')

          commands = []
          for p in sorted(glob.glob('admin-note-commands/*.json')):
              commands.extend(json.loads(pathlib.Path(p).read_text(encoding='utf-8')).get('updates', []))

          changed = 0
          skipped = []
          for row in commands:
              name = str(row.get('name') or '')
              note = str(row.get('note') or '')
              matches = [a for a in apps if str(a.get('name') or '') == name]
              if len(matches) != 1:
                  print(f'Skipped {name}: found {len(matches)} match(es)')
                  skipped.append(name)
                  continue
              matches[0]['note'] = note
              changed += 1
              print(f'Updated note: {name}')

          if changed == 0:
              raise RuntimeError('No JOM entries were updated')

          jom_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out = root / 'chunks'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          chunk_size = 100
          chunk_rows = []
          for index, start in enumerate(range(0, len(apps), chunk_size), 1):
              part = apps[start:start + chunk_size]
              filename = f'apps-{index:03d}.json'
              (out / filename).write_text(json.dumps({'apps': part}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              chunk_rows.append({'file': filename, 'start': start, 'count': len(part)})
          manifest = {
              'version': 1,
              'source': 'jom.json',
              'sourceHash': hashlib.sha256(jom_path.read_bytes()).hexdigest()[:20],
              'chunkSize': chunk_size,
              'total': len(apps),
              'chunks': chunk_rows,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          for p in glob.glob('admin-note-commands/*.json'):
              pathlib.Path(p).unlink(missing_ok=True)
          pathlib.Path('.github/workflows/temp-set-notes.yml').unlink(missing_ok=True)
          print(f'Applied {changed} note update(s); skipped {len(skipped)}.')

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks admin-note-commands .github/workflows/temp-set-notes.yml
          git commit -m 'Admin: Update JOM descriptions [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
