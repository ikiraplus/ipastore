name: Temporary Update Jewel Note
on:
  push:
    paths:
      - '.github/workflows/temp-jewel-note.yml'
permissions:
  contents: write
jobs:
  update-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Update Jewel note
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          root=pathlib.Path('.')
          p=root/'jom.json'
          doc=json.loads(p.read_text(encoding='utf-8'))
          apps=doc.get('apps',[])
          matches=[a for a in apps if str(a.get('bundleId') or '')=='com.linkdesks.puzzle.casual.jewelhunter']
          if len(matches)!=1:
              raise RuntimeError(f'Jewel target matches={len(matches)}')
          matches[0]['note']='مميزات اللعبة:\n- تفعيل عمليات الشراء الوهمية.\n- إزالة الإعلانات.\n\nملاحظة:\n- فعّل خاصية الاختراق من قائمة التعديلات.'
          print('Updated note:', matches[0].get('name'))
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          out=root/'chunks'
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True,exist_ok=True)
          rows=[]
          for i,start in enumerate(range(0,len(apps),100),1):
              part=apps[start:start+100]
              fn=f'apps-{i:03d}.json'
              (out/fn).write_text(json.dumps({'apps':part},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              rows.append({'file':fn,'start':start,'count':len(part)})
          manifest={'version':1,'source':'jom.json','sourceHash':hashlib.sha256(p.read_bytes()).hexdigest()[:20],'chunkSize':100,'total':len(apps),'chunks':rows}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          pathlib.Path('.github/workflows/temp-jewel-note.yml').unlink(missing_ok=True)
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks .github/workflows/temp-jewel-note.yml
          git commit -m 'Admin: Update Jewel Hunter description [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
