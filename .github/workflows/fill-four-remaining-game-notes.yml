name: Fill remaining game notes

on:
  push:
    paths:
      - '.github/workflows/fill-four-remaining-game-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill blank notes from screenshots
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          notes = {
              'Rodeo Stampede: Sky Zoo Safari': [
                  'فتح جميع الحيوانات والقبعات والزينة',
                  'إضافة وإزالة العملات',
                  'غش PVP',
                  'عدم الموت',
              ],
              'Chariot Rivals': [
                  'فتح النسخة الكاملة وجميع المناطق ومحتوى القصة',
                  'عدم الموت',
                  'إضافة الذهب',
              ],
              'Bloons Blitz': [
                  'عدم تلقي الضرر',
                  'قتل بضربة واحدة',
              ],
          }

          p = Path('jom.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          apps = data.get('apps', [])
          updated = []
          skipped = []
          missing = []

          by_name = {a.get('name'): a for a in apps if isinstance(a, dict)}
          for name, features in notes.items():
              app = by_name.get(name)
              if not app:
                  missing.append(name)
                  continue
              if app.get('category') != 'ألعاب':
                  raise SystemExit(f'{name}: not in games category')
              if str(app.get('note') or '').strip():
                  skipped.append(name)
                  continue
              app['note'] = '\n'.join(f'- {x}' for x in features)
              updated.append(name)

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(p.read_text(encoding='utf-8'))
          print('UPDATED:', updated)
          print('SKIPPED:', skipped)
          print('MISSING:', missing)
          for a in apps:
              if a.get('category') == 'ألعاب' and not str(a.get('note') or '').strip():
                  print('REMAINING_BLANK:', a.get('name'))
          PY
      - name: Commit jom.json
        shell: bash
        run: |
          if git diff --quiet -- jom.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jom.json
          git commit -m 'Add remaining game feature descriptions'
          git push
