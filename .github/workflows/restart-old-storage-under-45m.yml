name: Safely handoff old storage jobs to 45m limit

on:
  push:
    paths:
      - ".github/workflows/restart-old-storage-under-45m.yml"

permissions:
  contents: read
  actions: read

jobs:
  handoff:
    if: github.event.head_commit.message == 'Safely handoff old storage jobs to 45m limit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      STORAGE_WORKFLOW_ID: "337494956"
      OLD_RETRY_SHA: "cb63c5d9f861cefc4dc1a07196759c1ab2fbdba7"
      ORIGINAL_SHA: "6362773eb242cabb71911a4ba5d8cef2593c1746"
    steps:
      - name: Wait for old jobs and safely re-dispatch failures
        shell: bash
        run: |
          set -euo pipefail

          extract_env() {
            local logs="$1"
            local key="$2"
            printf '%s\n' "$logs" | sed -n "s/.*  ${key}: //p" | head -n 1 | tr -d '\r'
          }

          all_old="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?event=repository_dispatch&head_sha=$OLD_RETRY_SHA&per_page=100")"
          original_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?event=repository_dispatch&status=cancelled&head_sha=$ORIGINAL_SHA&per_page=100")"

          mapfile -t target_ids < <(printf '%s' "$all_old" | jq -r --argjson wid "$STORAGE_WORKFLOW_ID" '.workflow_runs[] | select(.workflow_id == $wid and (.status == "in_progress" or .status == "queued")) | .id' | sort -n)
          echo "Tracking ${#target_ids[@]} old active runs."

          if [ "${#target_ids[@]}" -eq 0 ]; then
            exit 0
          fi

          restarted=0
          succeeded=0
          unresolved=0

          for run_id in "${target_ids[@]}"; do
            echo "Waiting safely for old run $run_id to finish..."
            final_status=""
            final_conclusion=""

            # Poll for up to 55 minutes. Old runs already consumed most of their 120-minute window.
            for i in {1..220}; do
              run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              final_status="$(printf '%s' "$run_json" | jq -r '.status')"
              final_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"
              if [ "$final_status" = "completed" ]; then
                break
              fi
              sleep 15
            done

            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            final_status="$(printf '%s' "$run_json" | jq -r '.status')"
            final_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"
            title="$(printf '%s' "$run_json" | jq -r '.display_title')"

            if [ "$final_status" != "completed" ]; then
              echo "Still active at monitor limit; not creating a duplicate: $title"
              unresolved=$((unresolved + 1))
              continue
            fi

            if [ "$final_conclusion" = "success" ]; then
              echo "Old run succeeded; no retry needed: $title"
              succeeded=$((succeeded + 1))
              continue
            fi

            original_id="$(printf '%s' "$original_json" | jq -r --arg t "$title" --argjson wid "$STORAGE_WORKFLOW_ID" '.workflow_runs[] | select(.workflow_id == $wid and .display_title == $t) | .id' | head -n 1)"
            if [ -z "$original_id" ]; then
              echo "Could not find original payload for $title; no unsafe duplicate created."
              unresolved=$((unresolved + 1))
              continue
            fi

            logs="$(gh run view "$original_id" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null || true)"
            source_url="$(extract_env "$logs" PROXY_URL)"
            original_url="$(extract_env "$logs" ORIGINAL_URL)"
            asset_name="$(extract_env "$logs" ASSET_NAME)"
            short_id="$(extract_env "$logs" SHORT_ID)"
            callback_url="$(extract_env "$logs" CALLBACK_URL)"
            callback_start_url="$(extract_env "$logs" CALLBACK_START_URL)"
            callback_fail_url="$(extract_env "$logs" CALLBACK_FAIL_URL)"
            callback_token="$(extract_env "$logs" CALLBACK_TOKEN)"

            if [ -z "$source_url" ] || [ -z "$original_url" ] || [ -z "$asset_name" ] || [ -z "$short_id" ] || [ -z "$callback_url" ] || [ -z "$callback_start_url" ] || [ -z "$callback_fail_url" ] || [ -z "$callback_token" ]; then
              echo "Payload incomplete for $title; skipping safely."
              unresolved=$((unresolved + 1))
              continue
            fi

            payload="$(jq -n \
              --arg sourceUrl "$source_url" \
              --arg originalUrl "$original_url" \
              --arg assetName "$asset_name" \
              --arg shortId "$short_id" \
              --arg callbackUrl "$callback_url" \
              --arg callbackStartUrl "$callback_start_url" \
              --arg callbackFailUrl "$callback_fail_url" \
              --arg callbackToken "$callback_token" \
              '{event_type:"ikiraplus_storage",client_payload:{sourceUrl:$sourceUrl,originalUrl:$originalUrl,assetName:$assetName,shortId:$shortId,callbackUrl:$callbackUrl,callbackStartUrl:$callbackStartUrl,callbackFailUrl:$callbackFailUrl,callbackToken:$callbackToken}}')"

            printf '%s' "$payload" | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - >/dev/null
            echo "Fresh 45-minute run dispatched: $short_id"
            restarted=$((restarted + 1))
          done

          echo "Handoff summary: old_success=$succeeded fresh_45m_runs=$restarted unresolved=$unresolved"
