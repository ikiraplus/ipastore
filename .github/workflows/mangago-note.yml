name: MangaGo note
on:
  push:
    paths: ['.github/workflows/mangago-note.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update description
        run: |
          python - <<'PY'
          from pathlib import Path
          old='"name":"Manga Go Ultimate Manga App"'
          for p in [Path('jom.json'), *Path('chunks').glob('apps-*.json')]:
              s=p.read_text()
              i=s.find(old)
              if i<0: continue
              j=s.find('"note":"', i)
              if j<0: continue
              a=j+8
              b=s.find('"', a)
              s=s[:a]+'- بدون إعلانات.'+s[b:]
              p.write_text(s)
          PY
          rm .github/workflows/mangago-note.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Update MangaGo Arabic description'
          git push
