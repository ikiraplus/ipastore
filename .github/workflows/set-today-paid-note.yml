name: Set Today Paid Game Notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-today-paid-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update notes in jom.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('jom.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target_date = '2026-09-17'
          note = 'لعبة مدفوعة في المتجر الرسمي.'
          changed = []

          for app in data.get('apps', []):
              added = str(app.get('addedAt', ''))
              updated = str(app.get('updatedAt', ''))
              if added.startswith(target_date) or updated.startswith(target_date):
                  if app.get('note') != note:
                      app['note'] = note
                  changed.append(app.get('name', app.get('id', 'unknown')))

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Updated {len(changed)} items:')
          for name in changed:
              print('-', name)
          PY
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- jom.json; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jom.json
          git commit -m "Set paid game note for today's additions and updates"
          git push origin HEAD:main
