name: Fix MangaGo Arabic description once
on:
  push:
    paths:
      - '.github/workflows/fix-mangago-note-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch MangaGo note
        shell: python
        run: |
          import json, re
          from pathlib import Path
          target = "Manga Go Ultimate Manga App"
          note = "- بدون إعلانات."
          def apps_from(data):
              if isinstance(data, dict): return data.get("apps", [])
              if isinstance(data, list): return data
              return []
          def endq(s, q):
              i, esc = q + 1, False
              while i < len(s):
                  c=s[i]
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c=='"': return i+1
                  i+=1
              raise RuntimeError('unterminated')
          def patch(text, name):
              m=re.search(r'"name"\s*:\s*'+re.escape(json.dumps(name,ensure_ascii=False)), text)
              if not m: return text,False
              nxt=re.search(r'"name"\s*:',text[m.end():])
              stop=m.end()+nxt.start() if nxt else len(text)
              seg=text[m.end():stop]
              nm=re.search(r'"note"\s*:\s*',seg)
              if not nm: raise RuntimeError('note missing')
              q=m.end()+nm.end()
              while q<len(text) and text[q].isspace(): q+=1
              e=endq(text,q)
              return text[:q]+json.dumps(note,ensure_ascii=False)+text[e:],True
          changed=[]
          count=0
          for p in [Path('jom.json'), *sorted(Path('chunks').glob('apps-*.json'))]:
              raw=p.read_text(encoding='utf-8')
              try:
                  data=json.loads(raw)
              except Exception:
                  continue
              names=[str(a.get('name','')) for a in apps_from(data) if isinstance(a,dict) and str(a.get('name',''))==target]
              text=raw
              for n in names:
                  text,ok=patch(text,n)
                  if ok: count+=1
              if text!=raw:
                  json.loads(text)
                  p.write_text(text,encoding='utf-8')
                  changed.append(str(p))
          print('PATCH_COUNT',count)
          print('CHANGED',changed)
          data=json.loads(Path('jom.json').read_text(encoding='utf-8'))
          blanks=[str(a.get('name','')) for a in apps_from(data)[-50:] if isinstance(a,dict) and not str(a.get('note','')).strip()]
          print('LAST50_BLANK_COUNT',len(blanks))
          print('LAST50_BLANK_NAMES',json.dumps(blanks,ensure_ascii=False))
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-mangago-note-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix MangaGo Arabic description"
          git push
