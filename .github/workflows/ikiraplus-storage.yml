name: iKiraPlus Storage Backup

on:
  repository_dispatch:
    types: [ikiraplus_storage]

  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct/source URL"
        required: true
        type: string
      asset_name:
        description: "Release asset filename (example: app.ipa)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror-to-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      STORAGE_TAG: storage
      SOURCE_URL: ${{ github.event.client_payload.sourceUrl || inputs.source_url }}
      ASSET_NAME: ${{ github.event.client_payload.assetName || inputs.asset_name }}

    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_URL"
          test -n "$ASSET_NAME"

          case "$ASSET_NAME" in
            */*|*\\*) echo "Invalid asset name"; exit 1 ;;
          esac

      - name: Download and validate real file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ikiraplus-storage"

          python3 <<'PY'
          import os
          import re
          import sys
          import html
          import shutil
          import zipfile
          import pathlib
          import subprocess
          from urllib.parse import urlparse, quote

          source_url = os.environ["SOURCE_URL"].strip()
          asset_name = os.environ["ASSET_NAME"].strip()

          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ikiraplus-storage"
          work.mkdir(parents=True, exist_ok=True)

          candidate = work / "candidate.bin"
          page_file = work / "mediafire-page.html"
          final_file = work / asset_name
          cookie_file = work / "cookies.txt"

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )

          def run_curl(url, output, referer=None, use_cookies=False):
              if output.exists():
                  output.unlink()

              cmd = [
                  "curl",
                  "--fail",
                  "--location",
                  "--retry", "6",
                  "--retry-delay", "3",
                  "--retry-all-errors",
                  "--connect-timeout", "30",
                  "--max-time", "1800",
                  "--user-agent", UA,
                  "--header", "Accept: */*",
                  "--output", str(output),
              ]

              if referer:
                  cmd += ["--referer", referer]

              if use_cookies:
                  cmd += [
                      "--cookie-jar", str(cookie_file),
                      "--cookie", str(cookie_file),
                  ]

              cmd.append(url)

              print("Downloading from:", urlparse(url).netloc or url)
              subprocess.run(cmd, check=True)

          def validate_file(path, filename):
              if not path.exists() or path.stat().st_size <= 0:
                  return False, "empty file"

              size = path.stat().st_size
              ext = pathlib.Path(filename).suffix.lower()

              if ext in (".ipa", ".zip"):
                  if not zipfile.is_zipfile(path):
                      return False, "not a ZIP/IPA file"

                  if ext == ".ipa":
                      try:
                          with zipfile.ZipFile(path) as zf:
                              names = zf.namelist()
                          if not any(
                              name.startswith("Payload/") and ".app/" in name
                              for name in names
                          ):
                              return False, "ZIP exists but Payload/*.app is missing"
                      except Exception as exc:
                          return False, f"IPA validation failed: {exc}"

                  return True, f"valid {ext[1:].upper()} ({size} bytes)"

              if ext == ".dylib":
                  magic = path.read_bytes()[:4]
                  mach_o_magics = {
                      bytes.fromhex("feedface"),
                      bytes.fromhex("cefaedfe"),
                      bytes.fromhex("feedfacf"),
                      bytes.fromhex("cffaedfe"),
                      bytes.fromhex("cafebabe"),
                      bytes.fromhex("bebafeca"),
                      bytes.fromhex("cafebabf"),
                      bytes.fromhex("bfbafeca"),
                  }
                  if magic not in mach_o_magics:
                      return False, "not a Mach-O dylib"
                  return True, f"valid dylib ({size} bytes)"

              head = path.read_bytes()[:4096].lstrip().lower()
              if (
                  head.startswith(b"<!doctype html")
                  or head.startswith(b"<html")
                  or b"<html" in head[:512]
              ):
                  return False, "HTML page instead of file"

              return True, f"downloaded binary ({size} bytes)"

          def parse_mediafire_key(url):
              parsed = urlparse(url)
              host = parsed.netloc.lower()
              parts = [part for part in parsed.path.split("/") if part]

              # Canonical MediaFire page:
              # /file/<key>/<filename>/file
              if host.endswith("mediafire.com") and len(parts) >= 2:
                  if parts[0].lower() == "file" and len(parts) >= 2:
                      return parts[1]

              # Direct MediaFire CDN:
              # /<temporary-token>/<key>/<filename>
              if re.fullmatch(r"download\d+\.mediafire\.com", host):
                  if len(parts) >= 2:
                      return parts[-2]

              return None

          def canonical_mediafire_page(url):
              key = parse_mediafire_key(url)
              if not key:
                  return None
              return f"https://www.mediafire.com/file/{quote(key, safe='')}/file"

          def extract_mediafire_direct(page_path):
              try:
                  raw = page_path.read_text("utf-8", errors="ignore")
              except Exception:
                  return None

              raw = html.unescape(raw).replace("\\/", "/")

              patterns = [
                  r'''id=["']downloadButton["'][^>]*href=["']([^"']+)["']''',
                  r'''href=["'](https://download\d+\.mediafire\.com/[^"'<>\s]+)["']''',
                  r'''(https://download\d+\.mediafire\.com/[^"'<>\s]+)''',
              ]

              for pattern in patterns:
                  match = re.search(pattern, raw, flags=re.I | re.S)
                  if not match:
                      continue

                  direct = match.group(1).strip()

                  if direct.startswith("//"):
                      direct = "https:" + direct

                  if direct.startswith(("http://", "https://")):
                      return direct

              return None

          def download_from_mediafire(url):
              page_url = canonical_mediafire_page(url)
              if not page_url:
                  raise RuntimeError("Could not determine MediaFire file key")

              print("Resolving fresh MediaFire direct URL from:")
              print(page_url)

              # Get a fresh MediaFire file page at Action runtime.
              run_curl(page_url, page_file, use_cookies=True)

              direct_url = extract_mediafire_direct(page_file)
              if not direct_url:
                  raise RuntimeError(
                      "MediaFire page loaded but no fresh download URL was found"
                  )

              print("Fresh MediaFire direct URL resolved.")
              run_curl(
                  direct_url,
                  candidate,
                  referer=page_url,
                  use_cookies=True,
              )

          parsed_source = urlparse(source_url)
          source_host = parsed_source.netloc.lower()

          # Important:
          # downloadNNNN.mediafire.com URLs are temporary.
          # Never trust an old one saved by the Worker. Re-resolve it from the
          # permanent MediaFire file key at the moment this Action runs.
          if (
              source_host == "mediafire.com"
              or source_host == "www.mediafire.com"
              or re.fullmatch(r"download\d+\.mediafire\.com", source_host)
          ):
              download_from_mediafire(source_url)
          else:
              run_curl(source_url, candidate)

          valid, reason = validate_file(candidate, asset_name)

          # Fallback: if a non-canonical source still returned an HTML MediaFire
          # response, try resolving through MediaFire once more.
          if not valid:
              size = candidate.stat().st_size if candidate.exists() else 0
              head = candidate.read_bytes()[:32] if size else b""

              print("First response is not the requested file:", reason)
              print("Downloaded size:", size, "bytes")
              print("First bytes:", repr(head))

              mediafire_key = parse_mediafire_key(source_url)
              if mediafire_key:
                  download_from_mediafire(source_url)
                  valid, reason = validate_file(candidate, asset_name)

          if not valid:
              size = candidate.stat().st_size if candidate.exists() else 0
              head = candidate.read_bytes()[:32] if size else b""

              print("Final validation failed:", reason)
              print("Downloaded size:", size, "bytes")
              print("First bytes:", repr(head))
              print("Refusing to upload an invalid response to GitHub Release.")
              sys.exit(2)

          shutil.move(str(candidate), str(final_file))

          valid, reason = validate_file(final_file, asset_name)
          if not valid:
              print("Unexpected final validation failure:", reason)
              sys.exit(3)

          size = final_file.stat().st_size
          print("Validated real file:", final_file)
          print("Validation:", reason)
          print(f"Final size: {size} bytes ({size / 1024 / 1024:.2f} MiB)")
          PY

      - name: Ensure storage release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$STORAGE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STORAGE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "storage" \
              --notes "iKiraPlus permanent file storage"
          fi

      - name: Upload validated file to storage release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="$RUNNER_TEMP/ikiraplus-storage/$ASSET_NAME"

          echo "Uploading:"
          ls -lh "$FILE"

          gh release upload "$STORAGE_TAG" \
            "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify uploaded asset size
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          LOCAL="$RUNNER_TEMP/ikiraplus-storage/$ASSET_NAME"
          LOCAL_SIZE="$(stat -c%s "$LOCAL")"

          REMOTE_SIZE="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STORAGE_TAG" |
            jq -r --arg name "$ASSET_NAME" \
              '.assets[] | select(.name == $name) | .size' |
            tail -n 1
          )"

          echo "Local size : $LOCAL_SIZE bytes"
          echo "GitHub size: $REMOTE_SIZE bytes"

          test -n "$REMOTE_SIZE"
          test "$LOCAL_SIZE" = "$REMOTE_SIZE"

          echo "Upload verified successfully."
