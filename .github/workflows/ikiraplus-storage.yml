name: iKiraPlus Storage Backup
run-name: "iKiraPlus storage • ${{ github.event.client_payload.shortId }}"

on:
  repository_dispatch:
    types: [ikiraplus_storage]

permissions:
  contents: write
  actions: read

jobs:
  mirror-to-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # ماكو global concurrency: ملفات متعددة تشتغل بالتوازي حسب حدود GitHub.
    # مرحلة الرفع نفسها بيها jitter + timeout + retry حتى ما تبقى معلقة بلا نهاية.
    env:
      PROXY_URL: ${{ github.event.client_payload.sourceUrl }}
      ORIGINAL_URL: ${{ github.event.client_payload.originalUrl || github.event.client_payload.sourceUrl }}
      ASSET_NAME: ${{ github.event.client_payload.assetName }}
      SHORT_ID: ${{ github.event.client_payload.shortId }}
      CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
      CALLBACK_START_URL: ${{ github.event.client_payload.callbackStartUrl }}
      CALLBACK_FAIL_URL: ${{ github.event.client_payload.callbackFailUrl }}

    steps:
      - name: Report started to Worker
        shell: bash
        run: |
          set +e
          CALLBACK_TOKEN="$(jq -r '.client_payload.callbackToken // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$CALLBACK_TOKEN" ]; then exit 0; fi
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n \
            --arg id "$SHORT_ID" \
            --arg token "$CALLBACK_TOKEN" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg runUrl "$RUN_URL" \
            '{id:$id,token:$token,runId:$runId,runUrl:$runUrl}')"
          curl --silent --show-error --retry 8 --retry-delay 1 --retry-all-errors \
            --header "Content-Type: application/json" \
            --data "$payload" "$CALLBACK_START_URL" || true

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK_TOKEN="$(jq -r '.client_payload.callbackToken // empty' "$GITHUB_EVENT_PATH")"
          test -n "$PROXY_URL"
          test -n "$ORIGINAL_URL"
          test -n "$ASSET_NAME"
          test -n "$SHORT_ID"
          test -n "$CALLBACK_URL"
          test -n "$CALLBACK_START_URL"
          test -n "$CALLBACK_FAIL_URL"
          test -n "$CALLBACK_TOKEN"
          case "$ASSET_NAME" in
            */*|*\\*) echo "Invalid asset name"; exit 1 ;;
          esac

      - name: Download and validate real file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ikiraplus-storage"

          python3 <<'PY'
          import os
          import re
          import sys
          import html
          import shutil
          import zipfile
          import pathlib
          import subprocess
          import urllib.parse
          import urllib.request
          import time

          proxy_url = os.environ["PROXY_URL"].strip()
          original_url = os.environ["ORIGINAL_URL"].strip()
          asset_name = os.environ["ASSET_NAME"].strip()

          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ikiraplus-storage"
          work.mkdir(parents=True, exist_ok=True)

          candidate = work / "candidate.bin"
          page_file = work / "source-page.html"
          api_file = work / "mediafire-api.json"
          cookies = work / "cookies.txt"
          final_file = work / asset_name

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )

          def host_of(url):
              return (urllib.parse.urlparse(url).hostname or "").lower()

          def run_curl(url, output, referer=None, cookies_enabled=False, extra_headers=None):
              h = host_of(url)
              original_h = host_of(original_url)
              is_streamvault_source = (
                  original_h == "streamvaultpro.cc" or
                  original_h.endswith(".streamvaultpro.cc")
              )
              is_streamvault_request = (
                  h == "streamvaultpro.cc" or
                  h.endswith(".streamvaultpro.cc") or
                  (is_streamvault_source and url == proxy_url)
              )
              is_dylib = asset_name.lower().endswith(".dylib")
              resumable_streamvault = is_streamvault_request and not is_dylib

              # للملفات الكبيرة من StreamVault نحتفظ بالجزء الذي نزل حتى نكمل منه.
              if output.exists() and not resumable_streamvault:
                  output.unlink()

              cmd = [
                  "curl",
                  "--fail",
                  "--location",
                  "--retry", "5",
                  "--retry-delay", "1",
                  "--retry-all-errors",
                  "--connect-timeout", "20",
                  "--max-time", "2400",
                  "--user-agent", UA,
                  "--header", "Accept: application/octet-stream,application/zip,*/*;q=0.8",
                  "--header", "Accept-Language: en-US,en;q=0.9",
                  "--header", "Accept-Encoding: identity",
                  "--output", str(output),
              ]

              if referer:
                  cmd += ["--referer", referer]

              if cookies_enabled:
                  cmd += ["--cookie-jar", str(cookies), "--cookie", str(cookies)]

              for header in (extra_headers or []):
                  cmd += ["--header", header]

              # StreamVault: HTTP/1.1 + استكمال التنزيل للملفات الكبيرة.
              # لا نعتبر الاتصال عالقاً إلا إذا بقي أقل من 1 KiB/s لمدة دقيقتين.
              if is_streamvault_request:
                  if is_dylib:
                      cmd += [
                          "--http1.1",
                          "--no-keepalive",
                          "--connect-timeout", "6",
                          "--max-time", "60",
                          "--speed-limit", "8192",
                          "--speed-time", "8",
                          "--retry", "1",
                          "--retry-delay", "0",
                          "--retry-max-time", "20",
                      ]
                      print("StreamVault dylib guarded path: fast HTTP/1.1 anti-stall")
                  else:
                      cmd += [
                          "--http1.1",
                          "--no-keepalive",
                          "--connect-timeout", "20",
                          "--max-time", "18000",
                          "--speed-limit", "1024",
                          "--speed-time", "120",
                          "--retry", "3",
                          "--retry-delay", "3",
                          "--retry-all-errors",
                          "--retry-max-time", "3600",
                      ]
                      if output.exists() and output.stat().st_size > 0:
                          cmd += ["--continue-at", "-"]
                          print(
                              f"StreamVault large-file resume: continuing from "
                              f"{output.stat().st_size} bytes"
                          )
                      else:
                          print("StreamVault large-file path: HTTP/1.1 + resumable download")
              cmd.append(url)
              print("Downloading from:", host_of(url) or url)
              subprocess.run(cmd, check=True)

          def validate(path, filename):
              if not path.exists() or path.stat().st_size <= 0:
                  return False, "empty file"

              size = path.stat().st_size
              ext = pathlib.Path(filename).suffix.lower()

              if ext in (".ipa", ".zip"):
                  if not zipfile.is_zipfile(path):
                      return False, "not a ZIP/IPA file"

                  if ext == ".ipa":
                      try:
                          with zipfile.ZipFile(path) as zf:
                              names = zf.namelist()
                          if not any(n.startswith("Payload/") and ".app/" in n for n in names):
                              return False, "Payload/*.app is missing"
                      except Exception as exc:
                          return False, f"IPA validation failed: {exc}"

                  return True, f"valid {ext[1:].upper()} ({size} bytes)"

              if ext == ".dylib":
                  with path.open("rb") as fh:
                      magic = fh.read(4)
                  mach_o = {
                      bytes.fromhex("feedface"), bytes.fromhex("cefaedfe"),
                      bytes.fromhex("feedfacf"), bytes.fromhex("cffaedfe"),
                      bytes.fromhex("cafebabe"), bytes.fromhex("bebafeca"),
                      bytes.fromhex("cafebabf"), bytes.fromhex("bfbafeca"),
                  }
                  if magic not in mach_o:
                      return False, "not a Mach-O dylib"
                  return True, f"valid dylib ({size} bytes)"

              head = path.read_bytes()[:4096].lstrip().lower()
              if head.startswith(b"<!doctype html") or b"<html" in head[:512]:
                  return False, "HTML page instead of file"
              return True, f"binary file ({size} bytes)"

          def try_download(url, referer=None, cookies_enabled=False, extra_headers=None):
              try:
                  run_curl(url, candidate, referer, cookies_enabled, extra_headers)
              except Exception as exc:
                  print("Download attempt failed:", exc)
                  return False

              ok, reason = validate(candidate, asset_name)
              if ok:
                  print("Validated:", reason)
                  return True

              size = candidate.stat().st_size if candidate.exists() else 0
              head = candidate.read_bytes()[:80] if size else b""
              print("Downloaded response is invalid:", reason)
              print("Size:", size, "First bytes:", repr(head))
              return False

          # ---------------- MediaFire ----------------
          def is_mediafire(url):
              host = host_of(url)
              return host in ("mediafire.com", "www.mediafire.com") or re.fullmatch(r"download\d+\.mediafire\.com", host) is not None

          def mediafire_quick_key(url):
              parsed = urllib.parse.urlparse(url)
              host = (parsed.hostname or "").lower()
              parts = [urllib.parse.unquote(x) for x in parsed.path.split("/") if x]
              if host in ("mediafire.com", "www.mediafire.com") and len(parts) >= 2 and parts[0].lower() == "file":
                  return parts[1]
              if re.fullmatch(r"download\d+\.mediafire\.com", host) and len(parts) >= 3:
                  return parts[-2]
              return None

          def find_mediafire_direct(raw):
              raw = html.unescape(raw).replace("\\/", "/")
              patterns = [
                  r'''https://download\d+\.mediafire\.com/[^"'<>\s\\]+''',
                  r'''//download\d+\.mediafire\.com/[^"'<>\s\\]+''',
                  r'''id=["']downloadButton["'][^>]*href=["']([^"']+)["']''',
              ]
              for pattern in patterns:
                  m = re.search(pattern, raw, flags=re.I | re.S)
                  if not m:
                      continue
                  value = m.group(1) if m.lastindex else m.group(0)
                  if value.startswith("//"):
                      value = "https:" + value
                  if value.startswith("https://"):
                      return value
              return None

          def download_mediafire(url):
              qkey = mediafire_quick_key(url)
              if not qkey:
                  return False

              api_url = "https://www.mediafire.com/api/1.5/file/get_links.php?quick_key=" + urllib.parse.quote(qkey, safe="") + "&response_format=json"
              direct = None
              try:
                  run_curl(api_url, api_file, cookies_enabled=True)
                  direct = find_mediafire_direct(api_file.read_text("utf-8", errors="ignore"))
              except Exception:
                  pass

              page_url = "https://www.mediafire.com/file/" + urllib.parse.quote(qkey, safe="") + "/file"
              if not direct:
                  try:
                      run_curl(page_url, page_file, cookies_enabled=True)
                      direct = find_mediafire_direct(page_file.read_text("utf-8", errors="ignore"))
                  except Exception:
                      pass

              return bool(direct) and try_download(direct, referer=page_url, cookies_enabled=True)

          # ---------------- IPAOMTK ----------------
          def is_ipaomtk(url):
              host = host_of(url)
              return host in ("ipaomtk.com", "www.ipaomtk.com", "file.ipaomtk.com") or host.endswith(".ipaomtk.com")

          def ipaomtk_page_for(url):
              parsed = urllib.parse.urlparse(url)
              host = (parsed.hostname or "").lower()
              parts = [urllib.parse.unquote(x) for x in parsed.path.split("/") if x]
              if host == "file.ipaomtk.com" and parts:
                  return "https://ipaomtk.com/" + urllib.parse.quote(parts[0]) + "/"
              if host in ("ipaomtk.com", "www.ipaomtk.com"):
                  return url
              return "https://ipaomtk.com/"

          def extract_ipaomtk_direct(raw):
              raw = html.unescape(raw).replace("\\/", "/")
              patterns = [
                  r'''https://file\.ipaomtk\.com/[^"'<>\s\\]+?\.ipa(?:\?[^"'<>\s\\]*)?''',
                  r'''href=["']([^"']+\.ipa(?:\?[^"']*)?)["']''',
              ]
              for pattern in patterns:
                  m = re.search(pattern, raw, flags=re.I | re.S)
                  if not m:
                      continue
                  value = m.group(1) if m.lastindex else m.group(0)
                  value = urllib.parse.urljoin("https://ipaomtk.com/", value)
                  if value.startswith("https://"):
                      return value
              return None

          def download_ipaomtk(url):
              page_url = ipaomtk_page_for(url)
              direct = None

              # زيارة صفحة التطبيق أولاً للحصول على cookies والرابط المباشر الحالي.
              try:
                  run_curl(
                      page_url,
                      page_file,
                      referer="https://ipaomtk.com/",
                      cookies_enabled=True,
                      extra_headers=[
                          "Sec-Fetch-Site: same-origin",
                          "Sec-Fetch-Mode: navigate",
                          "Sec-Fetch-Dest: document",
                      ],
                  )
                  direct = extract_ipaomtk_direct(page_file.read_text("utf-8", errors="ignore"))
              except Exception as exc:
                  print("IPAOMTK page preload failed:", exc)

              candidates = []
              if direct:
                  candidates.append(direct)
              if host_of(url) == "file.ipaomtk.com":
                  candidates.append(url)

              seen = set()
              for direct_url in candidates:
                  if not direct_url or direct_url in seen:
                      continue
                  seen.add(direct_url)
                  if try_download(
                      direct_url,
                      referer=page_url,
                      cookies_enabled=True,
                      extra_headers=[
                          "Sec-Fetch-Site: same-site",
                          "Sec-Fetch-Mode: navigate",
                          "Sec-Fetch-Dest: document",
                          "Sec-Fetch-User: ?1",
                      ],
                  ):
                      return True

              # fallback: رابط DL الذي يعمل عندك بالمتصفح.
              return try_download(proxy_url)

          def download_streamvault_dylib_chunked(url):
              """
              StreamVault قد ينهار مع الاتصالات الطويلة من GitHub runners.
              نسحب dylib بقطع صغيرة عبر HTTP/1.1 (urllib) ونجمّعها محلياً.
              """
              chunk_size = 512 * 1024
              headers_base = {
                  "User-Agent": UA,
                  "Accept": "application/octet-stream,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Accept-Encoding": "identity",
                  "Connection": "close",
              }

              def request_range(start, end, timeout=20):
                  headers = dict(headers_base)
                  headers["Range"] = f"bytes={start}-{end}"
                  req = urllib.request.Request(url, headers=headers, method="GET")
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      status = getattr(resp, "status", resp.getcode())
                      content_range = resp.headers.get("Content-Range", "")
                      data = resp.read()
                      return status, content_range, data

              # Probe صغير لمعرفة الحجم الحقيقي.
              total = None
              for attempt in range(3):
                  try:
                      status, content_range, data = request_range(0, 0, timeout=15)
                      m = re.search(r"bytes\s+0-0/(\d+)", content_range, re.I)
                      if status == 206 and m:
                          total = int(m.group(1))
                          break
                      if status == 200 and data:
                          # بعض السيرفرات تتجاهل Range وتعيد الملف كاملاً.
                          candidate.write_bytes(data)
                          ok, reason = validate(candidate, asset_name)
                          if ok:
                              print("StreamVault dylib returned full file during probe:", reason)
                              return True
                  except Exception as exc:
                      print(f"StreamVault dylib size probe attempt {attempt + 1}/3 failed:", exc)
                      time.sleep(1)

              if not total or total <= 0:
                  print("Could not determine StreamVault dylib size for chunked download.")
                  return False

              print(f"StreamVault dylib chunked size: {total} bytes")
              if total > 100 * 1024 * 1024:
                  print("Refusing chunked dylib download above 100 MiB.")
                  return False

              if candidate.exists():
                  candidate.unlink()

              start = 0
              part_no = 0
              with candidate.open("wb") as out:
                  while start < total:
                      end = min(total - 1, start + chunk_size - 1)
                      expected = end - start + 1
                      part_no += 1
                      got = None

                      for attempt in range(3):
                          try:
                              status, content_range, data = request_range(start, end, timeout=20)
                              if status != 206:
                                  raise RuntimeError(f"expected HTTP 206, got {status}")
                              m = re.search(r"bytes\s+(\d+)-(\d+)/(\d+)", content_range, re.I)
                              if not m:
                                  raise RuntimeError(f"missing/invalid Content-Range: {content_range!r}")
                              rs, re_, rt = map(int, m.groups())
                              if rs != start or re_ != end or rt != total:
                                  raise RuntimeError(
                                      f"wrong Content-Range {content_range!r}; expected {start}-{end}/{total}"
                                  )
                              if len(data) != expected:
                                  raise RuntimeError(
                                      f"short chunk: got {len(data)} bytes, expected {expected}"
                                  )
                              got = data
                              break
                          except Exception as exc:
                              print(
                                  f"Chunk {part_no} {start}-{end} attempt {attempt + 1}/3 failed:",
                                  exc,
                              )
                              time.sleep(1)

                      if got is None:
                          return False

                      out.write(got)
                      out.flush()
                      print(f"Downloaded dylib chunk {part_no}: {start}-{end}")
                      start = end + 1

              if candidate.stat().st_size != total:
                  print("Chunked dylib size mismatch:", candidate.stat().st_size, "!=", total)
                  return False

              ok, reason = validate(candidate, asset_name)
              if not ok:
                  print("Chunked dylib validation failed:", reason)
                  return False

              print("Chunked dylib validated:", reason)
              return True


          # ---------------- Strategy ----------------
          if is_mediafire(original_url):
              print("MediaFire strategy")
              ok = download_mediafire(original_url)
          elif is_ipaomtk(original_url):
              print("IPAOMTK anti-hotlink strategy")
              ok = download_ipaomtk(original_url)
          elif host_of(original_url) == "streamvaultpro.cc" or host_of(original_url).endswith(".streamvaultpro.cc"):
              if asset_name.lower().endswith(".dylib"):
                  # للـdylib نستخدم تنزيل chunked مباشر من StreamVault.
                  # الطلبات الصغيرة Range تتجنب انهيار الاتصال الطويل.
                  print("StreamVault dylib chunked strategy")
                  ok = download_streamvault_dylib_chunked(original_url)
                  if not ok:
                      print("Direct chunked dylib failed; trying chunked Worker path.")
                      ok = download_streamvault_dylib_chunked(proxy_url)
                  if not ok:
                      print("Chunked paths failed; trying one guarded normal Worker download.")
                      ok = try_download(proxy_url)
              else:
                  # GitHub-hosted runners يحصل عندها stall متكرر مع StreamVault.
                  # نخلي Cloudflare Worker هو المسار الأول، والمصدر المباشر fallback.
                  print("StreamVault proxy-first strategy")
                  ok = try_download(proxy_url)
                  if not ok:
                      print("iKiraPlus proxy failed; trying StreamVault directly as fallback.")
                      ok = try_download(original_url)
          else:
              # أسرع مسار: GitHub يحمل المصدر مباشرة بدون hop إضافي عبر Worker.
              print("Direct-first strategy")
              ok = try_download(original_url)
              if not ok:
                  print("Direct source failed; falling back to iKiraPlus proxy.")
                  ok = try_download(proxy_url)

          if not ok:
              print("All download strategies failed.")
              sys.exit(2)

          shutil.move(str(candidate), str(final_file))
          valid, reason = validate(final_file, asset_name)
          if not valid:
              print("Unexpected final validation failure:", reason)
              sys.exit(3)

          size = final_file.stat().st_size
          print("Validated real file:", final_file)
          print("Validation:", reason)
          print(f"Final size: {size} bytes ({size / 1024 / 1024:.2f} MiB)")
          PY

      - name: Upload to first available storage release
        id: storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/ikiraplus-storage/$ASSET_NAME"
          LOCAL_SIZE="$(stat -c%s "$FILE")"

          # فقط 0-2 ثانية لتخفيف تصادم عشرات الـjobs بدون تأخير مصطنع يصل 29 ثانية.
          JITTER=$(( GITHUB_RUN_ID % 3 ))
          if [ "$JITTER" -gt 0 ]; then
            echo "Upload jitter: ${JITTER}s"
            sleep "$JITTER"
          fi

          asset_info() {
            local release_id="$1"
            { gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
                | jq -r --arg n "$ASSET_NAME" '.[] | select(.name == $n) | "\(.id) \(.size) \(.state)"'; } \
              | tail -n 1 || true
          }

          # تخزين تسلسلي صارم:
          # نبدأ دائماً من storage-2، وننتقل إلى storage-3 ثم storage-4... فقط عندما يمتلئ الحالي.
          # ممنوع إنشاء أي Release جديد تلقائياً.
          index=2

          while true; do
            tag="storage-$index"

            # إذا الـRelease غير موجود، نتوقف. لا ننشئ storage جديد.
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Storage release $tag does not exist. Automatic release creation is disabled."
              exit 1
            fi

            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
            info="$(asset_info "$release_id")"

            if [ -n "$info" ]; then
              read -r existing_id existing_size existing_state <<< "$info"
              if [ "$existing_state" = "uploaded" ] && [ "$existing_size" = "$LOCAL_SIZE" ]; then
                echo "Matching asset already exists in $tag; reusing it safely."
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "Removing only incomplete/mismatched asset id=$existing_id from $tag"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" >/dev/null 2>&1 || true
            fi

            count="$({ gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].id'; } | wc -l | tr -d ' ')"
            echo "$tag contains $count assets"

            # لا ننتقل للـstorage التالي إلا إذا الحالي ممتلئ.
            if [ "$count" -ge 1000 ]; then
              echo "$tag is full; moving sequentially to storage-$((index + 1))"
              index=$((index + 1))
              continue
            fi

            uploaded=0
            attempt=1
            while [ "$attempt" -le 2 ]; do
              echo "Upload attempt $attempt/2 to $tag"
              set +e
              timeout --foreground 7200s gh release upload "$tag" "$FILE" --repo "$GITHUB_REPOSITORY"
              rc=$?
              set -e

              # حتى إذا انقطع gh أو انتهى timeout، افحص GitHub قبل اعتبار المحاولة فاشلة.
              info="$(asset_info "$release_id")"
              if [ -n "$info" ]; then
                read -r existing_id existing_size existing_state <<< "$info"
                if [ "$existing_state" = "uploaded" ] && [ "$existing_size" = "$LOCAL_SIZE" ]; then
                  echo "Upload verified in $tag ($LOCAL_SIZE bytes)."
                  uploaded=1
                  break
                fi

                echo "Cleaning incomplete/mismatched retry asset id=$existing_id"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" >/dev/null 2>&1 || true
              fi

              echo "Upload attempt returned code $rc; retrying safely in the SAME release."
              sleep $(( attempt * 15 ))
              attempt=$((attempt + 1))
            done

            if [ "$uploaded" -eq 1 ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # إذا الرفع فشل والـRelease بعده بيه مجال، لا نتجاوزه إلى التالي.
            echo "Upload to $tag failed after retries. Sequential mode will not skip to another release."
            exit 1
          done

      - name: Verify uploaded asset size
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE_TAG: ${{ steps.storage.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          LOCAL="$RUNNER_TEMP/ikiraplus-storage/$ASSET_NAME"
          LOCAL_SIZE="$(stat -c%s "$LOCAL")"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STORAGE_TAG" --jq '.id')"
          REMOTE_SIZE="$({ gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" | jq -r --arg name "$ASSET_NAME" '.[] | select(.name == $name) | .size'; } | tail -n 1)"
          echo "Local size : $LOCAL_SIZE bytes"
          echo "GitHub size: $REMOTE_SIZE bytes"
          test -n "$REMOTE_SIZE"
          test "$LOCAL_SIZE" = "$REMOTE_SIZE"

      - name: Make GitHub the primary DL source immediately
        env:
          STORAGE_TAG: ${{ steps.storage.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK_TOKEN="$(jq -r '.client_payload.callbackToken // empty' "$GITHUB_EVENT_PATH")"
          test -n "$CALLBACK_TOKEN"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n \
            --arg id "$SHORT_ID" \
            --arg token "$CALLBACK_TOKEN" \
            --arg releaseTag "$STORAGE_TAG" \
            --arg assetName "$ASSET_NAME" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg runUrl "$RUN_URL" \
            '{id:$id,token:$token,releaseTag:$releaseTag,assetName:$assetName,runId:$runId,runUrl:$runUrl}')"
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors \
            --header "Content-Type: application/json" --data "$payload" "$CALLBACK_URL"

      - name: Report failure to Worker
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          set +e
          CALLBACK_TOKEN="$(jq -r '.client_payload.callbackToken // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "${CALLBACK_FAIL_URL:-}" ] || [ -z "$CALLBACK_TOKEN" ] || [ -z "${SHORT_ID:-}" ]; then exit 0; fi
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n \
            --arg id "$SHORT_ID" \
            --arg token "$CALLBACK_TOKEN" \
            --arg message "iKiraPlus Storage Backup failed — افتح GitHub Action للتفاصيل" \
            --arg conclusion "failure" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg runUrl "$RUN_URL" \
            '{id:$id,token:$token,message:$message,conclusion:$conclusion,runId:$runId,runUrl:$runUrl}')"
          curl --silent --show-error --retry 8 --retry-delay 1 --retry-all-errors \
            --header "Content-Type: application/json" --data "$payload" "$CALLBACK_FAIL_URL" || true