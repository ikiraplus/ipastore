name: Apply eight Arabic descriptions once

on:
  push:
    paths:
      - '.github/workflows/apply-eight-notes-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch note fields only
        shell: python
        run: |
          import json, re
          from pathlib import Path

          specs = [
            ("SD Gundam G Generation ETERNAL", lambda n,b: "sd gundam g generation eternal" in n.casefold() or b.casefold() == "jp.co.bandainamcoent.bnei0405", "- مضاعف الضرر.\n- مضاعف الدفاع.\n- طاقة مهارات غير محدودة."),
            ("MOBILE SUIT GUNDAM U.C. ENGAGE", lambda n,b: "mobile suit gundam u.c. engage" in n.casefold() or b.casefold() == "jp.co.bandainamcoent.bnei0423", "- مضاعف الضرر.\n- مضاعف الدفاع."),
            ("MangaGo", lambda n,b: "mangago" in n.casefold() or b.casefold() == "com.mouad.ouajib.mangago", "- بدون إعلانات."),
            ("Bingo Mastery", lambda n,b: "bingo mastery" in n.casefold() or b.casefold() == "com.casualgamesempire.bingomastery", "- كل شيء مجاني."),
            ("Duck Defense", lambda n,b: "duck defense" in n.casefold() or b.casefold() == "com.iaa.iosgl", "- عدم الموت.\n- القتل بضربة واحدة."),
            ("Fashion Match", lambda n,b: "fashion match" in n.casefold() or b.casefold() == "linkdesks.match.fashionmatch", "- تفعيل عمليات الشراء الوهمية.\n- إزالة الإعلانات.\n\nملاحظة: فعّل خاصية الاختراق من قائمة التعديلات."),
            ("Drop Away", lambda n,b: "drop away" in n.casefold() or b.casefold() == "com.brewgames.dropaway", "- تفعيل الشراء الوهمي.\n- كل شيء غير محدود.\n- تسريع اللعبة.\n- بدون إعلانات.\n\nملاحظة: فعّل الاختراق من قائمة التعديلات، ثم اخرج من اللعبة وأعد فتحها."),
            ("Dream Hospital", lambda n,b: "dream hospital" in n.casefold() or b.casefold() == "com.pu.dream.hospital", "- صناعة فورية مجانية.\n- صناديق هدايا مجانية، وتمنحك أيضاً ماسات عند الشراء.\n- طاقم عمل مجاني.\n- عملات ذهبية مجانية، اشترِ بالماس.\n- ميزة مميزة تتيح استلام مكافآت جميع الصناديق.\n- مكافأة خبرة مخصصة."),
          ]

          def apps_from(data):
            if isinstance(data, dict): return data.get("apps", [])
            if isinstance(data, list): return data
            return []

          def string_end(s, q):
            i, esc = q + 1, False
            while i < len(s):
              c = s[i]
              if esc: esc = False
              elif c == '\\': esc = True
              elif c == '"': return i + 1
              i += 1
            raise RuntimeError("unterminated string")

          def patch_by_name(text, name, note):
            pat = re.compile(r'"name"\s*:\s*' + re.escape(json.dumps(name, ensure_ascii=False)))
            m = pat.search(text)
            if not m: return text, False
            nxt = re.search(r'"name"\s*:', text[m.end():])
            stop = m.end() + nxt.start() if nxt else len(text)
            seg = text[m.end():stop]
            nm = re.search(r'"note"\s*:\s*', seg)
            if not nm: raise RuntimeError(f"note missing for {name}")
            q = m.end() + nm.end()
            while q < len(text) and text[q].isspace(): q += 1
            if q >= len(text) or text[q] != '"': raise RuntimeError(f"note not string for {name}")
            e = string_end(text, q)
            return text[:q] + json.dumps(note, ensure_ascii=False) + text[e:], True

          paths = [Path("jom.json"), *sorted(Path("chunks").glob("apps-*.json"))]
          counts = {k: 0 for k,_,_ in specs}
          changed = []

          for path in paths:
            raw = path.read_text(encoding="utf-8")
            data = json.loads(raw)
            matched = {k: [] for k,_,_ in specs}
            for app in apps_from(data):
              if not isinstance(app, dict): continue
              n = str(app.get("name", ""))
              b = str(app.get("bundleId", app.get("bundleID", "")))
              for k, pred, note in specs:
                if n and pred(n,b) and n not in matched[k]: matched[k].append(n)
            text = raw
            for k, pred, note in specs:
              for n in matched[k]:
                text2, ok = patch_by_name(text, n, note)
                if ok:
                  text = text2
                  counts[k] += 1
                  print(f"PATCH {path}: {k} -> {n!r}")
            if text != raw:
              json.loads(text)
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          print("COUNTS")
          for k,v in counts.items(): print(f"{k}: {v}")
          print("CHANGED", changed)

          data = json.loads(Path("jom.json").read_text(encoding="utf-8"))
          apps = apps_from(data)
          arr = apps[-50:]
          blanks = []
          for app in arr:
            if isinstance(app, dict) and not str(app.get("note", "")).strip():
              blanks.append(str(app.get("name", "")))
          print("LAST50_BLANK_COUNT", len(blanks))
          print("LAST50_BLANK_NAMES", json.dumps(blanks, ensure_ascii=False))

      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-eight-notes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update eight Arabic app descriptions"
          git push
