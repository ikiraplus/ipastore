name: Apply six Arabic descriptions once

on:
  push:
    paths:
      - '.github/workflows/apply-six-notes-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch note fields only
        shell: python
        run: |
          import json, re
          from pathlib import Path

          specs = [
            ("Only One", lambda n,b: n.casefold() == "only one" or "only one" in n.casefold(), "- عمليات الشراء داخل التطبيق مجانية لفتح المحتوى المميز مجاناً."),
            ("One Mage Army", lambda n,b: "one mage army" in n.casefold(), "- فوز تلقائي لإكمال المعارك تلقائياً.\n- فتح جميع شخصيات الأبطال.\n- تفعيل جميع العروض المتاحة داخل اللعبة.\n- إزالة الإعلانات أو تخطيها.\n- إضافة الذهب للحصول على عملة غير محدودة.\n- إضافة الأحجار الكريمة للحصول على العملة المميزة مجاناً.\n- إضافة المانا لتجديد مخزون المانا فوراً.\n- إضافة بطاقات الأبطال لفتح مسار تطوير بطاقات الأبطال.\n- إضافة قوة النسخ لتعزيز قوة وفعالية النسخ المستنسخة.\n- إضافة العناصر للحصول على المعدات والعناصر."),
            ("Tropicats", lambda n,b: "tropicats" in n.casefold(), "- ماسات غير محدودة.\n- عملات غير محدودة.\n- حياة لا نهائية.\n- معززات غير محدودة.\n- اختراق نقاط الخبرة والمستوى.\n- فوز تلقائي."),
            ("Cooking Wonder", lambda n,b: "cooking wonder" in n.casefold() or b.casefold() == "com.wonderlegend.cookingwonder", "- عملات غير محدودة تزداد بدلاً من أن تنقص."),
            ("Punko: Tower Defense", lambda n,b: "punko" in n.casefold() or b.casefold() == "com.agonalea.punko.io", "- لا تموت أبداً.\n- ضربة قاضية.\n- طاقة بطاقات لا نهائية.\n- نشر فوري للبطاقات.\n- متجر مجاني."),
            ("Infinity Kingdom", lambda n,b: "infinity kingdom" in n.casefold() or b.casefold() == "com.gtarcade.ioe.global", "- مضاعف الضرر لتعزيز قوة هجوم قواتك.\n- مضاعف الدفاع لتعزيز دفاعاتك ضد الهجمات الواردة.\n- تعديل القيمة، ويتطلب إعادة تشغيل اللعبة."),
          ]

          def apps_from(data):
            if isinstance(data, dict): return data.get("apps", [])
            if isinstance(data, list): return data
            return []

          def string_end(s, q):
            i, esc = q + 1, False
            while i < len(s):
              c = s[i]
              if esc: esc = False
              elif c == '\\': esc = True
              elif c == '"': return i + 1
              i += 1
            raise RuntimeError("unterminated string")

          def patch_by_name(text, name, note):
            pat = re.compile(r'"name"\s*:\s*' + re.escape(json.dumps(name, ensure_ascii=False)))
            m = pat.search(text)
            if not m: return text, False
            nxt = re.search(r'"name"\s*:', text[m.end():])
            stop = m.end() + nxt.start() if nxt else len(text)
            seg = text[m.end():stop]
            nm = re.search(r'"note"\s*:\s*', seg)
            if not nm: raise RuntimeError(f"note missing for {name}")
            q = m.end() + nm.end()
            while q < len(text) and text[q].isspace(): q += 1
            if q >= len(text) or text[q] != '"': raise RuntimeError(f"note not string for {name}")
            e = string_end(text, q)
            return text[:q] + json.dumps(note, ensure_ascii=False) + text[e:], True

          paths = [Path("jom.json"), *sorted(Path("chunks").glob("apps-*.json"))]
          counts = {k: 0 for k,_,_ in specs}
          changed = []

          for path in paths:
            raw = path.read_text(encoding="utf-8")
            data = json.loads(raw)
            matched = {k: [] for k,_,_ in specs}
            for app in apps_from(data):
              if not isinstance(app, dict): continue
              n = str(app.get("name", ""))
              b = str(app.get("bundleId", app.get("bundleID", "")))
              for k, pred, note in specs:
                if n and pred(n,b) and n not in matched[k]: matched[k].append(n)
            text = raw
            for k, pred, note in specs:
              for n in matched[k]:
                text2, ok = patch_by_name(text, n, note)
                if ok:
                  text = text2
                  counts[k] += 1
                  print(f"PATCH {path}: {k} -> {n!r}")
            if text != raw:
              json.loads(text)
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          print("COUNTS")
          for k,v in counts.items(): print(f"{k}: {v}")
          print("CHANGED", changed)

          data = json.loads(Path("jom.json").read_text(encoding="utf-8"))
          apps = apps_from(data)
          for label, arr in [("FIRST50", apps[:50]), ("LAST50", apps[-50:])]:
            blanks = []
            for app in arr:
              if isinstance(app, dict) and not str(app.get("note", "")).strip():
                blanks.append(str(app.get("name", "")))
            print(label + "_BLANK_COUNT", len(blanks))
            print(label + "_BLANK_NAMES", json.dumps(blanks, ensure_ascii=False))

      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-six-notes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update six Arabic app descriptions"
          git push
