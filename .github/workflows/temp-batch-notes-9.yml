name: Temporary Update JOM Notes 9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-batch-notes-9.yml'

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply note updates
        shell: python
        run: |
          import hashlib, json, pathlib, re, shutil

          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          doc = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = doc.get('apps', []) if isinstance(doc, dict) else doc

          def norm(s):
              return re.sub(r'[^a-z0-9]+', '', str(s or '').lower())

          updates = [
              {
                  'bundleId': 'com.pixelcubestudios.cookiecollector2',
                  'name': 'Cookies Inc Idle Tycoon 104100',
                  'note': 'مميزات اللعبة:\n- عمليات الشراء داخل التطبيق مجانية؛ اضغط على إلغاء عند الشراء.\n- مفعّل iGameGod.'
              },
              {
                  'bundleId': 'com.gamee.homepin2.manor.homescape',
                  'name': 'Home Pin 2 Family Adventure',
                  'note': 'مميزات اللعبة:\n- بدون إعلانات.\n- عملات غير محدودة.'
              },
              {
                  'bundleId': 'com.lastshelter.lingame',
                  'name': 'Idle Last Shelter',
                  'note': 'مميزات اللعبة:\n- بدون إعلانات مع مكافآت مجانية.\n- جواهر غير محدودة لتسريع الترقيات وعمليات الشراء.'
              },
              {
                  'bundleId': 'com.northskygames.SpiteAndMalice',
                  'name': 'Spite Malice',
                  'note': 'مميزات اللعبة:\n- عملات غير محدودة للإنفاق بحرية على السمات وأنواع الألعاب.'
              },
              {
                  'bundleId': 'com.STUCKPIXEL.NOC',
                  'name': 'Lucky Pirates Ahoy',
                  'note': 'مميزات اللعبة:\n- وضع عدم الموت.\n- القتل بضربة واحدة.\n- تجميد الأعداء.\n- غضب فوري.\n- عملات غير محدودة.'
              },
              {
                  'bundleId': 'com.lexenzolab.vs',
                  'name': 'Zombusters',
                  'note': 'مميزات اللعبة:\n- تجميد الجواهر والعملات والطاقة والموارد لمنع استهلاكها.\n- تفعيل العضوية المميزة وإزالة الإعلانات مع مكافآت مجانية.\n- جواهر وعملات وطاقة وموارد غير محدودة.\n- أقصى نقاط صحة وقوة هجوم.'
              },
              {
                  'name': 'Rap Star Idle Clicker',
                  'note': 'مميزات اللعبة:\n- عملات غير محدودة للإنفاق بحرية على الترقيات والتقدم.'
              },
              {
                  'bundleId': 'mobi.rain.sr.ios.release',
                  'name': 'Drag Racing Street Car Game',
                  'note': 'مميزات اللعبة:\n- ناقل حركة تلقائي محسن لتسارع أسرع.\n\nملاحظة:\n- اضبط ناقل الحركة على الوضع شبه التلقائي/التتابعي، واضغط دواسة الوقود بالكامل عند الإشارة الخضراء دون استخدام زر تبديل السرعة.'
              },
              {
                  'bundleId': 'com.infiniplay.merge.fashion.romance.story.ios',
                  'name': 'Merge Fashion Romance Story',
                  'note': 'مميزات اللعبة:\n- جواهر وعملات وطاقة غير محدودة.'
              },
              {
                  'bundleId': 'com.linkdesks.puzzle.casual.jewelhunter',
                  'name': 'Jewel Hunter Match 3',
                  'note': 'مميزات اللعبة:\n- تفعيل عمليات الشراء الوهمية.\n- إزالة الإعلانات.\n\nملاحظة:\n- فعّل خاصية الاختراق من قائمة التعديلات.'
              },
          ]

          changed = 0
          for upd in updates:
              bundle = upd.get('bundleId')
              name = upd.get('name')
              matches = []
              if bundle:
                  matches = [a for a in apps if str(a.get('bundleId') or '') == bundle]
              if not matches and name:
                  n = norm(name)
                  matches = [a for a in apps if norm(a.get('name')) == n]
              if len(matches) == 1:
                  matches[0]['note'] = upd['note']
                  changed += 1
                  print('Updated note:', matches[0].get('name'), matches[0].get('bundleId'))
              else:
                  print('Skipped', name, bundle, 'matches=', len(matches), [a.get('name') for a in matches])

          if changed == 0:
              raise RuntimeError('No entries updated')

          jom_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out = root / 'chunks'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          rows = []
          for index, start in enumerate(range(0, len(apps), 100), 1):
              part = apps[start:start+100]
              fn = f'apps-{index:03d}.json'
              (out/fn).write_text(json.dumps({'apps': part}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              rows.append({'file': fn, 'start': start, 'count': len(part)})
          manifest = {
              'version': 1,
              'source': 'jom.json',
              'sourceHash': hashlib.sha256(jom_path.read_bytes()).hexdigest()[:20],
              'chunkSize': 100,
              'total': len(apps),
              'chunks': rows,
          }
          (out/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          pathlib.Path('.github/workflows/temp-batch-notes-9.yml').unlink(missing_ok=True)
          print('Applied', changed, 'updates')

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks .github/workflows/temp-batch-notes-9.yml
          git commit -m 'Admin: Update JOM descriptions batch 9 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
