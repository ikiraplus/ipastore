name: Update remaining descriptions once
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-last-notes-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch notes only
        shell: python
        run: |
          import json, re, hashlib, shutil
          from pathlib import Path

          targets = [
              {"bundleId":"com.dmg.carsalessimulator", "note":"- عملة لا نهائية.\n- رفع مستوى سريع.\n- بدون إعلانات."},
              {"bundleId":"com.crazylabs.ladybug", "note":"- متجر مجاني.\n- اضغط شراء ثم إلغاء لتفعيل الميزة."},
              {"bundleId":"br.com.tapps.bidwars2", "note":"- عمليات الشراء داخل التطبيق مجانية.\n- فعّل الميزة أولاً من قائمة تعديل iOSGods."},
              {"bundleId":"com.playrix.manor-matters", "note":"- طاقة لا نهائية.\n- عملات لا نهائية.\n- معززات لا نهائية.\n- استخدم العملات لشراء المعززات."},
              {"name":"Instant Saver Story Reels", "note":"- فتح جميع مميزات VIP المدفوعة."},
          ]

          p = Path('jom.json')
          raw = p.read_text(encoding='utf-8')
          data = json.loads(raw)
          apps = data.get('apps', data if isinstance(data, list) else [])

          def endq(s, q):
              i, esc = q + 1, False
              while i < len(s):
                  c = s[i]
                  if esc:
                      esc = False
                  elif c == '\\':
                      esc = True
                  elif c == '"':
                      return i + 1
                  i += 1
              raise RuntimeError('unterminated string')

          def patch_note(text, name, note):
              pat = re.compile(r'"name"\s*:\s*' + re.escape(json.dumps(name, ensure_ascii=False)))
              m = pat.search(text)
              if not m:
                  return text, False
              nxt = re.search(r'"name"\s*:', text[m.end():])
              stop = m.end() + nxt.start() if nxt else len(text)
              seg = text[m.end():stop]
              nm = re.search(r'"note"\s*:\s*', seg)
              if not nm:
                  raise RuntimeError(f'note missing for {name}')
              q = m.end() + nm.end()
              while q < len(text) and text[q].isspace():
                  q += 1
              if q >= len(text) or text[q] != '"':
                  raise RuntimeError(f'note is not a string for {name}')
              e = endq(text, q)
              return text[:q] + json.dumps(note, ensure_ascii=False) + text[e:], True

          changed = []
          text = raw
          for t in targets:
              matches = []
              for a in apps:
                  if not isinstance(a, dict):
                      continue
                  if t.get('bundleId') and str(a.get('bundleId') or '') == t['bundleId']:
                      matches.append(a)
                  elif t.get('name') and str(a.get('name') or '') == t['name']:
                      matches.append(a)
              if len(matches) != 1:
                  raise RuntimeError(f"Target match count {len(matches)} for {t}")
              actual_name = str(matches[0].get('name') or '')
              text, ok = patch_note(text, actual_name, t['note'])
              if not ok:
                  raise RuntimeError(f'Could not patch {actual_name}')
              changed.append(actual_name)

          json.loads(text)
          p.write_text(text, encoding='utf-8')

          # Rebuild chunks from updated jom without changing any app fields.
          updated = json.loads(text)
          arr = updated.get('apps', updated if isinstance(updated, list) else [])
          out = Path('chunks')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          chunk_size = 100
          chunk_rows = []
          for index, start in enumerate(range(0, len(arr), chunk_size), 1):
              part = arr[start:start+chunk_size]
              fn = f'apps-{index:03d}.json'
              (out/fn).write_text(json.dumps({'apps':part}, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
              chunk_rows.append({'file':fn,'start':start,'count':len(part)})
          manifest = {
              'version':1,
              'source':'jom.json',
              'sourceHash':hashlib.sha256(p.read_bytes()).hexdigest()[:20],
              'chunkSize':chunk_size,
              'total':len(arr),
              'chunks':chunk_rows,
          }
          (out/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print('UPDATED', changed)

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/update-last-notes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jom.json chunks .github/workflows/update-last-notes-once.yml
          git commit -m "Update remaining app descriptions"
          git push
