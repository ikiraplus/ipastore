name: Temporary game note updater

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.head_commit.message == 'Diagnose game names' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose target names
        shell: bash
        run: |
          python3 - <<'PY'
          import json, difflib, re
          data=json.load(open('jom.json',encoding='utf-8'))
          names=[a.get('name','') for a in data.get('apps',[]) if a.get('category')=='ألعاب']
          targets=['Airplane Manager Tycoon','FIST OF THE NORTH STAR','Crowd Express: Boarding Puzzle','Splat! 2','Basketball Master: Slam Hero','Rules of Battlefield: 3D FPS','Viking Island: Merge Adventure','Infinite Master: Idle RPG','لعبة لمحة','Last Beacon: Survival']
          for t in targets:
              exact=[n for n in names if t.casefold() in n.casefold() or n.casefold() in t.casefold()]
              close=difflib.get_close_matches(t,names,n=5,cutoff=0.35)
              toks=[x for x in re.findall(r'[A-Za-z0-9]+',t.casefold()) if len(x)>=4]
              tokenhits=[n for n in names if any(x in n.casefold() for x in toks)][:10]
              print('\nTARGET:',t)
              print('EXACT:',exact)
              print('CLOSE:',close)
              print('TOKENS:',tokenhits)
          PY
