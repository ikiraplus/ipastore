name: Fill Moto X3M note

on:
  push:
    paths:
      - '.github/workflows/video-game-moto-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Moto X3M only if blank
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('jom.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          found=False
          for a in d.get('apps',[]):
              if a.get('category')=='ألعاب' and a.get('name')=='Moto X3M Bike Race Game':
                  found=True
                  if not str(a.get('note') or '').strip():
                      a['note']='- مشتريات داخل التطبيق مجانية'
                      print('UPDATED: Moto X3M Bike Race Game')
                  else:
                      print('SKIPPED_NONBLANK: Moto X3M Bike Race Game')
          if not found:
              raise SystemExit('Moto X3M Bike Race Game not found')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Commit jom.json
        shell: bash
        run: |
          if git diff --quiet -- jom.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jom.json
          git commit -m 'Add Moto X3M feature description'
          git push
