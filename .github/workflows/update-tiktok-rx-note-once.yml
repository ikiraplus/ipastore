name: Update TikTok RX Arabic description once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tiktok-rx-note-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch TikTok RX note
        shell: python
        run: |
          import json, re
          from pathlib import Path

          target = "TikTok RX Crack"
          note = """- إزالة جميع الإعلانات وإعلانات الإحالة.
- تنزيل الصور والفيديوهات من المنشورات والقصص والتعليقات والرسائل الخاصة.
- تنزيل الفيديوهات بجودة عالية تصل إلى 4K و60FPS وHDR عند توفرها.
- تنزيل الفيديوهات الخاصة بجودة عالية عند متابعة الحساب.
- إزالة العلامة المائية من الصور والفيديوهات.
- اختيار موقع الحفظ عبر نافذة المشاركة.
- عرض معلومات وإحصائيات الفيديو، بما في ذلك تاريخ الرفع والمنطقة وعدد الإعجابات والمشاهدات والتعليقات والمشاركات والتنزيلات.
- مشاهدة الملفات الشخصية بشكل مجهول.
- إخفاء حالة النشاط للمشاهدة بخصوصية أكبر.
- حفظ صور الملفات الشخصية ونسخ النبذة التعريفية.
- إخفاء عناصر وأزرار الواجهة غير المرغوبة ومقاطع المتجر والبث المباشر واقتراحات الأصدقاء.
- تشغيل الفيديو التالي تلقائياً وإظهار التمرير التلقائي حتى في المناطق غير المدعومة.
- تشغيل الفيديو داخل المشغل الأصلي للنظام.
- تخصيص نص إعادة النشر وإظهار أسماء المستخدمين بدلاً من الأسماء المستعارة.
- تعطيل تحذيرات المحتوى الحساس والاستبيانات والتنبيهات غير الضرورية.
- تعطيل النقر المزدوج في الخلاصة والقصص.
- تعطيل مؤشر الكتابة واكتشاف لقطات الشاشة وتسجيل الشاشة في الرسائل الخاصة.
- تنزيل وسائط الرسائل الخاصة وتنظيم المحادثات في مجلدات وتثبيت المحادثات.
- دعم الرسائل الصوتية والملصقات وميزات السلسلة والحيوانات المرتبطة بها حسب المنطقة.
- البدء مباشرة من تبويب المتابَعون.
- تخصيص حد تنزيل الفيديوهات للاستخدام دون اتصال.
- استيراد وتصدير وإعادة ضبط إعدادات RX وحفظ الإعدادات في Keychain.
- تغيير لغة RX بسرعة ودعم عدة لغات."""

          def apps_from(data):
              if isinstance(data, dict): return data.get("apps", [])
              if isinstance(data, list): return data
              return []

          def endq(s, q):
              i, esc = q + 1, False
              while i < len(s):
                  c = s[i]
                  if esc: esc = False
                  elif c == '\\': esc = True
                  elif c == '"': return i + 1
                  i += 1
              raise RuntimeError('unterminated string')

          def patch(text, name):
              pat = re.compile(r'"name"\s*:\s*' + re.escape(json.dumps(name, ensure_ascii=False)))
              m = pat.search(text)
              if not m: return text, False
              nxt = re.search(r'"name"\s*:', text[m.end():])
              stop = m.end() + nxt.start() if nxt else len(text)
              seg = text[m.end():stop]
              nm = re.search(r'"note"\s*:\s*', seg)
              if not nm: raise RuntimeError(f'note missing for {name}')
              q = m.end() + nm.end()
              while q < len(text) and text[q].isspace(): q += 1
              if q >= len(text) or text[q] != '"': raise RuntimeError(f'note is not a string for {name}')
              e = endq(text, q)
              return text[:q] + json.dumps(note, ensure_ascii=False) + text[e:], True

          count = 0
          changed = []
          for p in [Path('jom.json'), *sorted(Path('chunks').glob('apps-*.json'))]:
              raw = p.read_text(encoding='utf-8')
              try:
                  data = json.loads(raw)
              except Exception:
                  continue
              names = [str(a.get('name','')) for a in apps_from(data) if isinstance(a,dict) and str(a.get('name','')) == target]
              text = raw
              for n in names:
                  text, ok = patch(text, n)
                  if ok: count += 1
              if text != raw:
                  json.loads(text)
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          print('PATCH_COUNT', count)
          print('CHANGED', changed)
          if count == 0:
              raise SystemExit('TikTok RX Crack not found')

          data = json.loads(Path('jom.json').read_text(encoding='utf-8'))
          arr = apps_from(data)[-50:]
          blanks = [str(a.get('name','')) for a in arr if isinstance(a,dict) and not str(a.get('note','')).strip()]
          print('LAST50_BLANK_COUNT', len(blanks))
          print('LAST50_BLANK_NAMES', json.dumps(blanks, ensure_ascii=False))
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/update-tiktok-rx-note-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update TikTok RX Arabic description"
          git push
