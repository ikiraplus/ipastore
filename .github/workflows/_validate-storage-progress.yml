name: Validate storage progress workflow

on:
  push:
    paths:
      - .github/workflows/_validate-storage-progress.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate embedded Python and required markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          p = Path('.github/workflows/ikiraplus-storage.yml')
          s = p.read_text(encoding='utf-8')
          required = [
              'CALLBACK_PROGRESS_URL',
              'EXPECTED_SIZE',
              'def report_progress(',
              'def run_with_file_progress(',
              'uploads.github.com',
              'stage": "upload"',
          ]
          for marker in required:
              assert marker in s, marker

          m = re.search(r"          python3 <<'PY'\n(.*?)\n          PY\n", s, re.S)
          assert m, 'main python heredoc not found'
          main_py = textwrap.dedent(m.group(1))
          compile(main_py, '<download-progress>', 'exec')

          m = re.search(r"          cat > \"\$UPLOADER\" <<'PY_UPLOAD'\n(.*?)\n          PY_UPLOAD\n", s, re.S)
          assert m, 'uploader heredoc not found'
          upload_py = textwrap.dedent(m.group(1))
          compile(upload_py, '<release-upload-progress>', 'exec')

          print('Storage progress workflow validation passed')
          PY
