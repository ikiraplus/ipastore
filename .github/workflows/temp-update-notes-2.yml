name: Temporary Update JOM Notes 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-update-notes-2.yml'

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply note updates
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          doc = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = doc.get('apps', [])
          if not isinstance(apps, list):
              raise RuntimeError('jom.json apps array not found')

          updates = {
              'com.alien.shooter.galaxy.attack': 'مميزات اللعبة:\n- الذخيرة بأقصى حد.\n- الحياة بأقصى حد.\n- مضاعفة الضرر.',
              'com.funsea.castlemaster': 'مميزات اللعبة:\n- مضاعفة العملات.\n- مضاعفة الماس.\n- مضاعفة الأحجار الكريمة الخضراء.\n- مضاعفة نقاط الخبرة (EXP).\n- مضاعفة الكؤوس.\n- صناديق متعددة.\n- صندوق الساحة مجاني.\n- كشف المربعات دون الحاجة إلى العملات الذهبية (B-Gold).\n- فوز سهل.',
              'com.pixelperfectdude.htdrive': 'مميزات اللعبة:\n- تفعيل الشراء الوهمي.\n- تسريع اللعبة.\n- بدون إعلانات.\n\nملاحظة:\n- فعّل الهاك من قائمة التعديلات.',
              'com.kidslearning.coloring.slatepad': 'مميزات اللعبة:\n- تم فتح اللعبة بالكامل وجميع المحتويات المدفوعة.',
              'com.foxieplay.kids.cooking.games': 'مميزات اللعبة:\n- تم فتح اللعبة بالكامل وجميع المحتويات المدفوعة.',
              'com.craox.magic.color': 'مميزات اللعبة:\n- تم فتح اللعبة بالكامل وجميع المحتويات المدفوعة.',
              'com.advant.lamar': 'مميزات اللعبة:\n- نقود غير محدودة وتزداد بدلاً من أن تنقص.\n- ذهب غير محدود؛ أنفق جزءاً منه لتفعيل الميزة.',
              'cz.marekpenicka.viruszombiehunter': 'مميزات اللعبة:\n- الأعداء لا يستطيعون الهجوم.\n- موارد غير محدودة وتزداد بدلاً من أن تنقص.\n- ذخيرة غير محدودة.',
              'com.unimob.icy.village': 'مميزات اللعبة:\n- عملات غير محدودة وتزداد بدلاً من أن تنقص.',
              'com.deuscraft.TurboTeam': 'مميزات اللعبة:\n- أرواح غير محدودة.'
          }

          changed = 0
          missing = []
          for bundle_id, note in updates.items():
              matches = [a for a in apps if str(a.get('bundleId') or '') == bundle_id]
              if len(matches) != 1:
                  print(f'Skipped {bundle_id}: found {len(matches)} match(es)')
                  missing.append(bundle_id)
                  continue
              matches[0]['note'] = note
              changed += 1
              print(f"Updated note: {matches[0].get('name')} ({bundle_id})")

          if changed == 0:
              raise RuntimeError('No JOM entries were updated')

          jom_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out = root / 'chunks'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          chunk_size = 100
          chunk_rows = []
          for index, start in enumerate(range(0, len(apps), chunk_size), 1):
              part = apps[start:start + chunk_size]
              filename = f'apps-{index:03d}.json'
              (out / filename).write_text(json.dumps({'apps': part}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              chunk_rows.append({'file': filename, 'start': start, 'count': len(part)})
          manifest = {
              'version': 1,
              'source': 'jom.json',
              'sourceHash': hashlib.sha256(jom_path.read_bytes()).hexdigest()[:20],
              'chunkSize': chunk_size,
              'total': len(apps),
              'chunks': chunk_rows,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          pathlib.Path('.github/workflows/temp-update-notes-2.yml').unlink(missing_ok=True)
          print(f'Applied {changed} note update(s); skipped {len(missing)}.')

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks .github/workflows/temp-update-notes-2.yml
          git commit -m 'Admin: Update 10 JOM descriptions [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
