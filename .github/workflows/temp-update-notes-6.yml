name: Temporary Update JOM Notes 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-update-notes-6.yml'

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply note updates
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          doc = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = doc.get('apps', [])
          if not isinstance(apps, list):
              raise RuntimeError('jom.json apps array not found')

          updates = [
              {
                  'prefix': 'Arrow Pro 3D',
                  'note': 'مميزات اللعبة:\n- فوز تلقائي لإكمال المستويات فوراً.\n- عملات وأرواح غير محدودة.\n- تلميحات وتلميحات كبرى غير محدودة.\n- مضاعفة العملات والتلميحات والتلميحات الكبرى.\n- إضافة العملات والتلميحات والتلميحات الكبرى يدوياً.'
              },
              {
                  'name': 'Wrappin',
                  'bundleId': 'com.suversal.wrappin',
                  'note': 'تطبيق لمحاكاة وتغيير الموقع الجغرافي على أجهزة iPhone.\n- تحديد موقع وهمي من الخريطة أو عبر الإحداثيات والبحث باستخدام خرائط Apple.\n- محاكاة المشي والقيادة على مسارات مع التحكم بسرعة الحركة وإيقافها واستكمالها.\n- تغيير الموقع أثناء الجلسة دون إعادة الاتصال والعودة عبر نفس المسار.\n- حفظ المواقع المفضلة وسجل المواقع الأخيرة ونسخ العنوان أو الإحداثيات.\n- استعادة الموقع الحقيقي عند إيقاف المحاكاة ودعم أنماط الخرائط والوضعين الفاتح والداكن.\n- يتطلب iOS 27 أو أحدث مع تفعيل وضع المطور.'
              },
              {
                  'name': 'RVX Tiktok',
                  'bundleId': 'com.zhiliaoapp.musically',
                  'note': 'مميزات التطبيق:\n- تنزيل الفيديوهات والصور وجميع صور المنشور والصوت، مع نسخ روابط الفيديو والصوت والوصف وحفظ التنزيلات في ألبوم مخصص مع شريط تقدم وإلغاء اختياري.\n- زر RVX مدمج مع تخصيص الضغط والضغط المطول، وإعادة ترتيب أو إخفاء الخيارات والأقسام وعرضها كقوائم فرعية وإخفاء واجهة المشاهدة سريعاً.\n- قراءة الرسائل دون إيصال قراءة، إخفاء الكتابة والنشاط مع مشاهدة نشاط الآخرين، الاحتفاظ بالرسائل المحذوفة وإرسال ملفات صوتية أو استخراج الصوت من الفيديو.\n- تنزيل وسائط القصص وصوتها ونسخ الرابط والوصف، مشاهدة القصص دون كشف المشاهدة مع تحكم يدوي أو تلقائي بحالة المشاهدة وتخصيص قائمة القصص.\n- حفظ صورة الحساب ونسخ اسم المستخدم والاسم والنبذة وإظهار حالة المتابعة، مع توسيع حدود النصوص وإظهار توثيق وهمي وتخصيص أعداد المتابعين محلياً.\n- قفل TikTok برمز 4 أو 6 أرقام مع Face ID وTouch ID، وإخفاء عناصر RVX أثناء تسجيل الشاشة وفتح الروابط خارجياً وتنظيف روابط التتبع.\n- إخفاء الإعلانات من الصفحة الرئيسية، التشغيل التلقائي للفيديو التالي وإبقاء شريط التقدم ظاهراً وقابلاً للسحب.\n- تأكيد اختياري قبل الإعجاب أو عدم الإعجاب أو متابعة الحسابات.\n- عرض وتنظيف الكاش يدوياً أو تلقائياً، وتصدير واستيراد إعدادات RVXTikTok بصيغة JSON مع حفظ تخصيصات القوائم.'
              },
          ]

          changed = 0
          skipped = []
          for row in updates:
              bundle = row.get('bundleId')
              name = row.get('name')
              prefix = row.get('prefix')
              matches = []
              if bundle:
                  matches = [a for a in apps if str(a.get('bundleId') or '') == bundle]
              if not matches and name:
                  matches = [a for a in apps if str(a.get('name') or '') == name]
              if not matches and prefix:
                  matches = [a for a in apps if str(a.get('name') or '').startswith(prefix)]
              if len(matches) != 1:
                  label = name or prefix or bundle
                  print(f'Skipped {label}: found {len(matches)} match(es)')
                  skipped.append(label)
                  continue
              matches[0]['note'] = row['note']
              changed += 1
              print('Updated note:', matches[0].get('name'))

          if changed == 0:
              raise RuntimeError('No JOM entries were updated')

          jom_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out = root / 'chunks'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          chunk_size = 100
          chunk_rows = []
          for index, start in enumerate(range(0, len(apps), chunk_size), 1):
              part = apps[start:start + chunk_size]
              filename = f'apps-{index:03d}.json'
              (out / filename).write_text(json.dumps({'apps': part}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              chunk_rows.append({'file': filename, 'start': start, 'count': len(part)})
          manifest = {
              'version': 1,
              'source': 'jom.json',
              'sourceHash': hashlib.sha256(jom_path.read_bytes()).hexdigest()[:20],
              'chunkSize': chunk_size,
              'total': len(apps),
              'chunks': chunk_rows,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          pathlib.Path('.github/workflows/temp-update-notes-6.yml').unlink(missing_ok=True)
          print(f'Applied {changed} note update(s); skipped {len(skipped)}.')

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks .github/workflows/temp-update-notes-6.yml
          git commit -m 'Admin: Update Arrow, WrapPin and RVX descriptions [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
