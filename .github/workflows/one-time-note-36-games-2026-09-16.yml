name: One-time update notes for 36 games

on:
  push:
    paths:
      - '.github/workflows/one-time-note-36-games-2026-09-16.yml'

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update note for the exact 36 games
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('jom.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target_note = 'لعبة مدفوعة في المتجر الرسمي.'

          targets = {
              'hitman sniper hack',
              'Goat Simulator 3 - Multiverse',
              'Backyard Baseball 97',
              'Tokaido',
              'Incredibox',
              'World Of Dinosaurs',
              'Machinarium',
              'Ticket To Ride',
              'Rcs - Real Combat Simulator',
              'Lanota Music Game With Story',
              'Amazing Frog',
              'The Last Game',
              'Hocus',
              'Blazing Star',
              'Old Monterrey Pixel Adventure',
              'Arcadia Watch Games',
              'Gun Rounds',
              'Enigmo',
              'Octagon 1 Maximal Challenge',
              'Sinkr 3',
              "Sally's Law",
              'Vectronom',
              'Train Kit',
              'Air Navy Fighters',
              "Don't Starve Pocket Edition",
              'Planets 7',
              'Cytus 1',
              'RFS - Real Flight Simulator',
              'Doodle Jump',
              'Clay Jam Classic',
              'Kingdom Rush Frontiers Td',
              'Badland 2',
              'Badland',
              'Goat Simulator MMO',
              'Goat Simulator 3',
              'Cytus 2',
          }

          matched = []
          for app in data.get('apps', []):
              updated = str(app.get('updatedAt', ''))
              if app.get('name') in targets and updated.startswith('2026-09-16'):
                  matched.append(app)

          matched_names = {app.get('name') for app in matched}
          missing = sorted(targets - matched_names)
          if len(matched) != 36 or missing:
              raise SystemExit(f'Expected exact 36 entries; matched {len(matched)}. Missing: {missing}. Names: {[a.get("name") for a in matched]}')

          changed = 0
          for app in matched:
              if app.get('note') != target_note:
                  app['note'] = target_note
                  changed += 1

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Matched exactly {len(matched)} entries; changed note on {changed}.')
          for app in matched:
              print(f"{app.get('name')} | {app.get('updatedAt')} | {app.get('note')}")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jom.json
          git diff --cached --quiet && exit 0
          git commit -m "Set paid-store note for exact 36 games updated on 2026-09-16"
          git push
