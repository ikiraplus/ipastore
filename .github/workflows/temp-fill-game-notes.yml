name: Temporary Game Note Updater

on:
  push:
    branches: [main]
    paths:
      - 'note-commands/*.json'

permissions:
  contents: write

concurrency:
  group: temp-fill-game-notes
  cancel-in-progress: false

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fill blank game notes only
        shell: python
        run: |
          import glob
          import json
          import pathlib
          import re
          import unicodedata

          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          data = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = data.get('apps', []) if isinstance(data, dict) else data
          if not isinstance(apps, list):
              raise RuntimeError('jom.json does not contain an apps array')

          def norm(value):
              value = unicodedata.normalize('NFKC', str(value or '')).casefold()
              value = re.sub(r'[^\w]+', '', value, flags=re.UNICODE)
              return value

          changed = 0
          for command_path in sorted(glob.glob('note-commands/*.json')):
              cmd = json.loads(pathlib.Path(command_path).read_text(encoding='utf-8'))
              for upd in cmd.get('updates', []):
                  wanted_name = str(upd.get('name') or '').strip()
                  wanted_version = str(upd.get('version') or '').strip()
                  note = str(upd.get('note') or '').strip()
                  if not wanted_name or not note:
                      continue

                  wn = norm(wanted_name)
                  candidates = []
                  for index, app in enumerate(apps):
                      an = norm(app.get('name'))
                      if not an:
                          continue
                      name_match = (an == wn) or (wn in an) or (an in wn)
                      if not name_match:
                          continue
                      if wanted_version and str(app.get('version') or '').strip() != wanted_version:
                          continue
                      candidates.append(index)

                  if len(candidates) != 1:
                      print(f'SKIP {wanted_name} {wanted_version}: matches={len(candidates)}')
                      continue

                  index = candidates[0]
                  current_note = str(apps[index].get('note') or '').strip()
                  if current_note:
                      print(f'SKIP {apps[index].get("name")}: note already exists')
                      continue

                  apps[index]['note'] = note
                  changed += 1
                  print(f'UPDATED {apps[index].get("name")} {apps[index].get("version")}')

              pathlib.Path(command_path).unlink(missing_ok=True)

          if changed:
              if isinstance(data, dict):
                  data['apps'] = apps
                  payload = data
              else:
                  payload = apps
              jom_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'Changed notes: {changed}')

      - name: Commit changes and clean command files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jom.json note-commands 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Fill missing game descriptions [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
