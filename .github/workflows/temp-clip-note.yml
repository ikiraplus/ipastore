name: Temporary Update Clip Maker Note

on:
  push:
    paths:
      - '.github/workflows/temp-clip-note.yml'

permissions:
  contents: write

jobs:
  update-note:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update Clip Maker note
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('.')
          jom_path = root / 'jom.json'
          doc = json.loads(jom_path.read_text(encoding='utf-8'))
          apps = doc.get('apps', []) if isinstance(doc, dict) else doc
          target = None
          for app in apps:
              if app.get('bundleId') == 'com.mkapps.Vcaption' or app.get('name') == 'Clip Maker: AI Video Clipping':
                  target = app
                  break
          if target is None:
              raise RuntimeError('Clip Maker entry not found')
          target['note'] = 'مميزات التطبيق:\n- فتح جميع مميزات VIP المدفوعة.'
          jom_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out = root / 'chunks'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)
          rows = []
          for index, start in enumerate(range(0, len(apps), 100), 1):
              part = apps[start:start+100]
              fn = f'apps-{index:03d}.json'
              (out/fn).write_text(json.dumps({'apps': part}, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              rows.append({'file': fn, 'start': start, 'count': len(part)})
          manifest = {
              'version': 1,
              'source': 'jom.json',
              'sourceHash': hashlib.sha256(jom_path.read_bytes()).hexdigest()[:20],
              'chunkSize': 100,
              'total': len(apps),
              'chunks': rows,
          }
          (out/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          pathlib.Path('.github/workflows/temp-clip-note.yml').unlink(missing_ok=True)
          print('Updated:', target.get('name'), target.get('bundleId'))

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jom.json chunks .github/workflows/temp-clip-note.yml
          git commit -m 'Admin: Update Clip Maker description [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
